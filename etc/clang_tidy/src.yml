# ============================================================
# GOOGLE C++ STYLE GUIDE - ENFORCED BY CLANG-TIDY
#
# This codebase is written by an AI coding assistant (Claude).
# There is no human code review. These rules are the ONLY
# guardrails ensuring code quality and consistency. If a rule
# is disabled or weakened, there is NOTHING ELSE stopping bad
# code from landing in main.
#
# RULES FOR THE AI:
# 1. NEVER disable a check to fix a build.
#    Fix the CODE, not the config.
# 2. NEVER add a function/class/variable to an IgnoredRegexp
#    to bypass naming rules. Rename the code instead.
# 3. NEVER weaken a threshold (raise limits, remove prefixes,
#    change Case rules).
# 4. The ONLY valid exceptions are names mandated by the C++
#    standard (listed explicitly below with section refs).
# 5. If you think a rule is wrong, you are wrong. Research
#    the Google C++ Style Guide before touching this file.
# ============================================================
---
CheckOptions:
  # misc-include-cleaner runs whole: a file includes the header that declares
  # each symbol it uses and no header it uses nothing from. Nothing is ignored,
  # and IgnoreHeaders is not set, because from 2026-09-18 every translation unit
  # and header under src/ and test/ satisfies both halves. The one include a
  # file may rely on for what it pulls in is vpi_user.h's include of
  # vpi_compatibility.h: the source Annex K.2 prints has vpi_user.h include that
  # file (printed page 1319), and K.1 has every simulator provide the file as
  # printed, so the include is the standard's; Annex L.1 draws the consequence
  # that an application is not to include the file directly, and L.2 makes a
  # direct include an error, so a translation unit that selects a compatibility
  # mode reaches the renaming macros through vpi_user.h alone. Nothing else
  # exports anything:
  # vpi_user.h is Annex K.2's file and declares what it provides, and Annex
  # M's sv_vpi_user.h includes it as the annex does, with §36.7 telling an
  # application to include both.
  readability-function-cognitive-complexity.Threshold: 15
  readability-function-size.LineThreshold: 200
  readability-function-size.NestingThreshold: 4
  readability-function-size.ParameterThreshold: 5
  readability-function-size.StatementThreshold: 50
  readability-identifier-naming.ClassCase: CamelCase
  readability-identifier-naming.ClassConstantCase: CamelCase
  readability-identifier-naming.ClassConstantPrefix: k
  readability-identifier-naming.ConstantCase: CamelCase
  # A parameter declared const, as IEEE 1800-2023 Annex I.3 declares every
  # svScope and svOpenArrayHandle parameter of svdpi.h, is a parameter still;
  # left unset, the check would read it as a constant and ask for kCamelCase
  readability-identifier-naming.ConstantParameterCase: lower_case
  readability-identifier-naming.ConstantPrefix: k
  readability-identifier-naming.ConstexprVariableCase: CamelCase
  readability-identifier-naming.ConstexprVariablePrefix: k
  readability-identifier-naming.EnumCase: CamelCase
  readability-identifier-naming.EnumConstantCase: CamelCase
  readability-identifier-naming.EnumConstantPrefix: k
  readability-identifier-naming.FunctionCase: CamelCase
  # C++ standard: main, coroutine promise/awaitable methods
  # IEEE 1800-2023: the 41 vpi_ routines Annex K.2 declares on printed pages
  # 1319 to 1321, in the order printed; vpi_register_assertion_cb, which Annex
  # M declares; the 84 compatibility-mode variants Annex L.2's macros name on
  # printed pages 1323 to 1325, vpi_compare_objects_1364v1995 through
  # vpi_scan_1800v2012, fourteen routines under each of six versions, which
  # src/simulator/vpi_compatibility.cpp defines; the 66 sv* functions Annex
  # I.3 declares on printed pages 1294 to 1298; and the 17 functions of the
  # deprecated portion Annex I.3 prints on pages 1299 to 1300 that
  # src/simulator/svdpi_sv31a.h provides, the sixteen open-array Vec32
  # functions of page 1300 being not provided and so not named. Each group is
  # in the order printed. §H.2 says svdpi.h defines all of the interface's
  # functions, so the names stand here one by one and no pattern stands in
  # for them.
  # The value is one parenthesized alternation because the check wraps it as
  # ^…$ before matching: unparenthesized, the anchors bind to the first and
  # last alternatives alone and every alternative between them matches as a
  # substring, which is how vpi_get64 passed on vpi_get before every routine
  # was named here.
  readability-identifier-naming.FunctionIgnoredRegexp: '(main|get_return_object|initial_suspend|final_suspend|return_void|return_value|unhandled_exception|await_ready|await_suspend|await_resume|vpi_register_cb|vpi_remove_cb|vpi_get_cb_info|vpi_register_systf|vpi_get_systf_info|vpi_handle_by_name|vpi_handle_by_index|vpi_handle|vpi_handle_multi|vpi_iterate|vpi_scan|vpi_get|vpi_get64|vpi_get_str|vpi_get_delays|vpi_put_delays|vpi_get_value|vpi_put_value|vpi_get_value_array|vpi_put_value_array|vpi_get_time|vpi_mcd_open|vpi_mcd_close|vpi_mcd_name|vpi_mcd_printf|vpi_printf|vpi_compare_objects|vpi_chk_error|vpi_free_object|vpi_release_handle|vpi_get_vlog_info|vpi_get_data|vpi_put_data|vpi_get_userdata|vpi_put_userdata|vpi_vprintf|vpi_mcd_vprintf|vpi_flush|vpi_mcd_flush|vpi_control|vpi_handle_by_multi_index|vpi_register_assertion_cb|vpi_compare_objects_1364v1995|vpi_control_1364v1995|vpi_get_1364v1995|vpi_get_str_1364v1995|vpi_get_value_1364v1995|vpi_handle_1364v1995|vpi_handle_by_index_1364v1995|vpi_handle_by_multi_index_1364v1995|vpi_handle_by_name_1364v1995|vpi_handle_multi_1364v1995|vpi_iterate_1364v1995|vpi_put_value_1364v1995|vpi_register_cb_1364v1995|vpi_scan_1364v1995|vpi_compare_objects_1364v2001|vpi_control_1364v2001|vpi_get_1364v2001|vpi_get_str_1364v2001|vpi_get_value_1364v2001|vpi_handle_1364v2001|vpi_handle_by_index_1364v2001|vpi_handle_by_multi_index_1364v2001|vpi_handle_by_name_1364v2001|vpi_handle_multi_1364v2001|vpi_iterate_1364v2001|vpi_put_value_1364v2001|vpi_register_cb_1364v2001|vpi_scan_1364v2001|vpi_compare_objects_1364v2005|vpi_control_1364v2005|vpi_get_1364v2005|vpi_get_str_1364v2005|vpi_get_value_1364v2005|vpi_handle_1364v2005|vpi_handle_by_index_1364v2005|vpi_handle_by_multi_index_1364v2005|vpi_handle_by_name_1364v2005|vpi_handle_multi_1364v2005|vpi_iterate_1364v2005|vpi_put_value_1364v2005|vpi_register_cb_1364v2005|vpi_scan_1364v2005|vpi_compare_objects_1800v2005|vpi_control_1800v2005|vpi_get_1800v2005|vpi_get_str_1800v2005|vpi_get_value_1800v2005|vpi_handle_1800v2005|vpi_handle_by_index_1800v2005|vpi_handle_by_multi_index_1800v2005|vpi_handle_by_name_1800v2005|vpi_handle_multi_1800v2005|vpi_iterate_1800v2005|vpi_put_value_1800v2005|vpi_register_cb_1800v2005|vpi_scan_1800v2005|vpi_compare_objects_1800v2009|vpi_control_1800v2009|vpi_get_1800v2009|vpi_get_str_1800v2009|vpi_get_value_1800v2009|vpi_handle_1800v2009|vpi_handle_by_index_1800v2009|vpi_handle_by_multi_index_1800v2009|vpi_handle_by_name_1800v2009|vpi_handle_multi_1800v2009|vpi_iterate_1800v2009|vpi_put_value_1800v2009|vpi_register_cb_1800v2009|vpi_scan_1800v2009|vpi_compare_objects_1800v2012|vpi_control_1800v2012|vpi_get_1800v2012|vpi_get_str_1800v2012|vpi_get_value_1800v2012|vpi_handle_1800v2012|vpi_handle_by_index_1800v2012|vpi_handle_by_multi_index_1800v2012|vpi_handle_by_name_1800v2012|vpi_handle_multi_1800v2012|vpi_iterate_1800v2012|vpi_put_value_1800v2012|vpi_register_cb_1800v2012|vpi_scan_1800v2012|svDpiVersion|svGetBitselBit|svGetBitselLogic|svPutBitselBit|svPutBitselLogic|svGetPartselBit|svGetPartselLogic|svPutPartselBit|svPutPartselLogic|svLeft|svRight|svLow|svHigh|svIncrement|svSize|svDimensions|svGetArrayPtr|svSizeOfArray|svGetArrElemPtr|svGetArrElemPtr1|svGetArrElemPtr2|svGetArrElemPtr3|svPutBitArrElemVecVal|svPutBitArrElem1VecVal|svPutBitArrElem2VecVal|svPutBitArrElem3VecVal|svPutLogicArrElemVecVal|svPutLogicArrElem1VecVal|svPutLogicArrElem2VecVal|svPutLogicArrElem3VecVal|svGetBitArrElemVecVal|svGetBitArrElem1VecVal|svGetBitArrElem2VecVal|svGetBitArrElem3VecVal|svGetLogicArrElemVecVal|svGetLogicArrElem1VecVal|svGetLogicArrElem2VecVal|svGetLogicArrElem3VecVal|svGetBitArrElem|svGetBitArrElem1|svGetBitArrElem2|svGetBitArrElem3|svGetLogicArrElem|svGetLogicArrElem1|svGetLogicArrElem2|svGetLogicArrElem3|svPutLogicArrElem|svPutLogicArrElem1|svPutLogicArrElem2|svPutLogicArrElem3|svPutBitArrElem|svPutBitArrElem1|svPutBitArrElem2|svPutBitArrElem3|svGetScope|svSetScope|svGetNameFromScope|svGetScopeFromName|svPutUserData|svGetUserData|svGetCallerInfo|svIsDisabledState|svAckDisabledState|svGetTime|svGetTimeUnit|svGetTimePrecision|svSizeOfBitPackedArr|svSizeOfLogicPackedArr|svPutBitVec32|svPutLogicVec32|svGetBitVec32|svGetLogicVec32|svGetSelectBit|svGetSelectLogic|svPutSelectBit|svPutSelectLogic|svGetPartSelectBit|svGetBits|svGet32Bits|svGet64Bits|svGetPartSelectLogic|svPutPartSelectBit|svPutPartSelectLogic)'
  readability-identifier-naming.GlobalConstantCase: CamelCase
  readability-identifier-naming.GlobalConstantPrefix: k
  readability-identifier-naming.LocalConstantCase: CamelCase
  readability-identifier-naming.LocalConstantPrefix: k
  readability-identifier-naming.MethodCase: CamelCase
  # C++ standard: coroutine promise/awaitable + container concept methods
  readability-identifier-naming.MethodIgnoredRegexp: 'get_return_object|initial_suspend|final_suspend|return_void|return_value|unhandled_exception|await_ready|await_suspend|await_resume|push_back|begin|end|size|empty|data'
  readability-identifier-naming.NamespaceCase: lower_case
  readability-identifier-naming.ParameterCase: lower_case
  # IEEE 1800-2023 Annex K.2 and Annex I.3: the parameter names the
  # prototypes of vpi_user.h and svdpi.h carry as the annexes print them
  readability-identifier-naming.ParameterIgnoredRegexp: 'refHandle|refHandle1|refHandle2|numOfBytes|dataLoc|fileName|scopeName|userKey|userData|lineNumber'
  readability-identifier-naming.PrivateMemberCase: lower_case
  readability-identifier-naming.PrivateMemberSuffix: '_'
  readability-identifier-naming.ProtectedMemberCase: lower_case
  readability-identifier-naming.ProtectedMemberSuffix: '_'
  readability-identifier-naming.PublicMemberCase: lower_case
  # IEEE 1800-2023 Annex M: the members of s_vpi_assertion_step_info and
  # s_vpi_attempt_info as the annex spells them
  readability-identifier-naming.PublicMemberIgnoredRegexp: 'stateFrom|stateTo|failExpr|attemptStartTime'
  readability-identifier-naming.ScopedEnumConstantCase: CamelCase
  readability-identifier-naming.ScopedEnumConstantPrefix: k
  readability-identifier-naming.StaticConstantCase: CamelCase
  readability-identifier-naming.StaticConstantPrefix: k
  # C++23 coroutine promise_type [coroutine.handle]
  # IEEE 1800-2023 Annex I/K/L/M C struct tags (t_vpi_*, s_vpi_*, t_cb_data)
  readability-identifier-naming.StructCase: CamelCase
  readability-identifier-naming.StructIgnoredRegexp: 'promise_type|t_vpi_.*|s_vpi_.*|t_cb_data'
  readability-identifier-naming.TemplateParameterCase: CamelCase
  readability-identifier-naming.TypeAliasCase: CamelCase
  readability-identifier-naming.TypedefCase: CamelCase
  # IEEE 1800-2023 Annex I/K/L/M: VPI/DPI C-API typedefs and struct tags,
  # with Annex K.2's vpiHandle and PLI_ sized types
  readability-identifier-naming.TypedefIgnoredRegexp: 's_vpi_.*|s_cb_data|p_cb_data|sv[A-Z].*|t_vpi_.*|p_vpi_.*|vpi_assertion_callback_func|vpiHandle|PLI_.*'
  readability-identifier-naming.VariableCase: lower_case
# Disabled checks (only valid exceptions, see header rule 4):
# - bugprone-random-generator-seed: IEEE 1800-2023 18.13/18.14 require
#   randomization to be reproducible (same seed -> same sequence;
#   srandom/get_randstate/set_randstate). The check demands an unpredictable
#   seed, which would break that guarantee.
# - bugprone-command-processor: IEEE 1800-2023 20.17.1 defines $system as
#   passing its argument to the C system() command processor; the check forbids
#   the one call the task is specified to make.
# - bugprone-incorrect-roundings: IEEE 1800-2023 Annex N.2 rounds every
#   distribution draw with (long)(r + 0.5), and the annex's code is the
#   normative algorithm; the check forbids the one rounding the standard
#   specifies.
Checks: >-
  -*,
  bugprone-*,
  -bugprone-easily-swappable-parameters,
  -bugprone-random-generator-seed,
  -bugprone-command-processor,
  -bugprone-incorrect-roundings,
  cppcoreguidelines-avoid-goto,
  cppcoreguidelines-init-variables,
  cppcoreguidelines-slicing,
  misc-include-cleaner,
  misc-redundant-expression,
  misc-unused-parameters,
  modernize-use-auto,
  modernize-use-nullptr,
  modernize-use-override,
  performance-*,
  readability-function-cognitive-complexity,
  readability-function-size,
  readability-identifier-naming,
  readability-redundant-smartptr-get,
  readability-simplify-boolean-expr,
  clang-diagnostic-unused-function
# lib/cpp is deliberately absent. It holds the fixtures, helpers and models the
# unit tests are built on, and etc/clang_tidy/test_src_unit.yml names it because
# that is the tier whose thresholds those headers answer to. No .cpp under src/
# includes one, so naming it here would check nothing.
HeaderFilterRegex: '(src|test)/.*\.h$'
