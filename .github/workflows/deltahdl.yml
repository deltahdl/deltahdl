  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/deltahdl.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/actions/*/action.yml \
            .github/workflows/deltahdl.yml \
            etc/clang_tidy/*.yml
name: deltahdl
on:
  push:
    branches: [main]
    paths:
      - .github/actions/**
      - .github/workflows/deltahdl.yml
      - CMakeLists.txt
      - etc/**
      - lib/cpp/**
      - lib/python/run_tests_common/**
      - scripts/assert_subclause_citations/**
      - scripts/run_integration_tests/**
      - scripts/run_sim_tests/**
      - scripts/run_sv_tests/**
      - src/**
      - test/CMakeLists.txt
      - test/src/**
  workflow_dispatch:
