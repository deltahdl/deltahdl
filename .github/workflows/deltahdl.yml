        uses: actions/download-artifact@v8
        with:
          name: coverage-simulator
          path: build/src/
      - name: Fix permissions
        run: chmod +x build/src/deltahdl
      - name: Seed profile pools
        uses: ./.github/actions/seed-profile-pools
        with:
          images: build/src/deltahdl
      - name: E2E tests
        run: PYTHONPATH=.:scripts python3 -m run_sim_tests
      - name: E2E test with no room for the simulation thread's stack
        run: |
          expected=$(cat test/src/e2e/hello.expected)
          actual=$(ulimit -v 786432 && build/src/deltahdl test/src/e2e/hello.sv 2>&1)
          printf "%s\n" "$actual"
          if [ "$actual" != "$expected" ]; then
            printf 'expected:\n%s\ngot:\n%s\n' "$expected" "$actual"
            exit 1
          fi
