        run: >-
          pmd cpd
          --minimum-tokens 100
          --language cpp
          --dir test/src/
          --dir lib/cpp/
  determining-yamllint:
    outputs:
      yamllint-necessary: ${{ steps.decide.outputs.yamllint-necessary }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        name: Decide whether YAML linting is necessary
        run: |
          # A push names the commit its branch stood at beforehand, and that
          # is the only event with a base to name. A workflow_dispatch run
          # leaves this empty, which the fallback below answers by listing the
          # whole tree.
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          zero='0000000000000000000000000000000000000000'
          # Listing the whole tree is never wrong, only wasteful: it answers
          # yes on any push whose base is missing, zeroed or unreachable, and
          # that is what a workflow_dispatch run wants, since the tree holds
          # the files the pattern names.
          if [ -z "$base" ] || [ "$base" = "$zero" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git ls-files | tee changed-files.txt
