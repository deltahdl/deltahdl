  prune-ccache:
    # Every ccache and ctcache key here ends in github.sha, so no run ever
    # reuses a stale entry as its primary key — and so every commit mints a
    # whole new generation while nothing retires the last one. The repository
    # gets 10 GB of cache for all jobs together, and GitHub reclaims an overage
    # by evicting whatever was least recently used, so a generation left behind
    # does not cost the job that made it: it costs some other job its entire
    # cache. Every ccache job here caps at 200M bar the coverage shards, which
    # take 240M to hold a slice apiece, so one generation of all of them is
    # about 5.5 GB, most of it those 18 shards. A new entry is written
    # before this job removes the superseded one, so the figure that has to fit
    # under 10 GB is two generations of it, and adding a cached job means
    # budgeting twice its CCACHE_MAXSIZE times its matrix width.
    # What is kept is the newest entry per cache identity, not the entry for
    # this commit. actions/cache skips its save step when an earlier step in the
    # job failed, so a run that goes red saves nothing, and keying on the
    # current sha would either delete the last good generation or never run at
    # all. Newest-per-identity is correct either way: it keeps whatever the
    # restore-keys would have found.
    #
    # Nothing is pruned out from under a job that has not restored yet. The five
    # jobs below are the last in this graph to write a cache, and two of the
    # others that do — build-coverage-lib and the coverage unit-test shards — are
    # ancestors of all five by way of cache-sv-tests, through assert-coverage, so
    # naming them here as well would add no ordering. The clang-tidy shards start
    # at the root of the graph and nothing waits on them, so they can still be
    # running when this job does; what protects them is the rule below rather than
    # any ordering. The newest entry per identity is what is kept and the newest
    # is what a restore-key match would have found, so a shard yet to restore
    # finds the same entry it would have found had this job never run, and one
    # that has already restored is retiring a generation it is done with.
    # Only on a push to main, so a pull-request run cannot delete the caches main
    # builds against.
    #
    # !cancelled() is what makes the five reachable rather than merely ordered. A
    # single failing unit test skips assert-coverage and so skips all five, and
    # the default is for a job to be skipped along with any dependency that did
    # not succeed; !cancelled() runs it anyway. That is the difference between run
    # 30504953092, which lacked the guard and skipped this job while the coverage
    # shards ahead of the gate had already deposited a fresh 8 GB generation, and
    # run 30506064344, equally red with all five equally skipped, where it ran and
    # retired that generation. A red main is precisely when the quota needs this.
    if: >-
      !cancelled()
      && github.ref_name == 'main'
      && github.event_name == 'push'
    needs:
      - build-asan-ubsan
      - build-macos-26-arm64-clang
      - build-tsan
      - build-ubuntu-24-04-x86-64-clang
      - build-ubuntu-24-04-x86-64-gcc
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        name: Delete superseded cache entries
        run: |
          # Every key here is <identity>-<CMakeLists hash>-<sha>, so dropping
          # the last two hyphen-separated fields leaves the identity: one
          # build job, or one shard of one. Newest first, the first sighting of
          # an identity is the entry to keep and the rest are superseded. The
          # CMakeLists hash has to be dropped along with the sha, because
          # registering a unit test changes it and every generation would
          # otherwise be an identity of its own with nothing ever superseded.
          #
          # The selection is awk rather than grep so that finding nothing is an
          # exit code of 0: there is nothing wrong with a run that has no
          # superseded entries, and this step runs under `set -o pipefail`.
          # sv-tests-*, pmd-* and pip-* are keyed by the thing they hold rather
          # than by commit, so they never go stale and are left alone.
          keys=$(gh cache list --limit 1000 --json createdAt,key \
            --jq '.[] | select(.key | test("^(ccache-build-|ctcache-)"))
              | "\(.createdAt)\t\(.key)"' \
            | sort -r \
            | awk -F'\t' '{
                identity = $2
                sub(/-[^-]*-[^-]*$/, "", identity)
                if (identity in newest) print $2
                newest[identity] = 1
              }')
          for key in ${keys}; do
            echo "Deleting superseded cache entry: ${key}"
            gh cache delete "${key}"
          done
  release:
    if: >-
      github.ref_name == 'main'
      && github.event_name == 'push'
    needs:
      - e2e-test-macos-26-arm64-clang
      - e2e-test-asan-ubsan
      - e2e-test-tsan
      - e2e-test-ubuntu-24-04-x86-64-clang
      - e2e-test-ubuntu-24-04-x86-64-gcc
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download Ubuntu build
        uses: actions/download-artifact@v4
        with:
          name: build-ubuntu-24-04-x86-64-gcc-shard-0
          path: ubuntu-build/
      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: build-macos-26-arm64-clang
          path: macos-build/
      - id: version
        name: Generate version from UTC time
        run: >-
          echo "version=$(date -u +%Y%m%d%H%M%S)"
          >> $GITHUB_OUTPUT
      - name: Create tag
        run: >-
          git tag
          "v${{ steps.version.outputs.version }}"
      - name: Push tag
        run: >-
          git push origin
          "v${{ steps.version.outputs.version }}"
      - env:
          GH_TOKEN: ${{ github.token }}
        name: Create GitHub Release
        run: |
          cp ubuntu-build/src/deltahdl \
            deltahdl-linux-amd64
          cp macos-build/src/deltahdl \
            deltahdl-macos-arm64
          gh release create \
            "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            deltahdl-linux-amd64 \
            deltahdl-macos-arm64
      - name: Update latest tag
        run: |
          git tag -f latest
          git push origin latest --force
  unit-test-asan-ubsan:
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    name: unit-test-asan-ubsan-shard-${{ matrix.shard }}
    needs: build-asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-asan-ubsan-shard-${{ matrix.shard }}
          path: build/
      - name: Fix permissions
        run: >-
          find build/test -maxdepth 1 -type f -name 'test_*'
          -exec chmod +x {} +
      - name: Unit tests
        run: >-
          ctest --test-dir build --output-on-failure
          --label-exclude e2e --timeout 60
          --exclude-regex '_NOT_BUILT'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
  unit-test-coverage:
    # A shard compiles and runs its slice of the unit tests, caching the
    # instrumented objects it makes and nothing else, src/ arriving prebuilt.
    # The cap is sized to hold exactly one slice. An instrumented unit-test
    # object measures about 1.43 MB, a figure read off the twenty-shard matrix
    # this job used to run: 200M held a whole 139-object slice, the entries it
    # saved measured 198 MB apiece, and eighteen of the twenty shards took 139
    # hits out of 139 with no misses at all. Eighteen shards divide the same
    # 2,775 targets into slices of 154 and 155, which is 221 MB at that rate,
    # so 240M holds one with something left over for ccache's own bookkeeping.
    # The cap holds one shard's slice and evicts everything else, which is what
    # it is here to do.
    #
    # Sizing it by anything but the slice spends the repository's cache quota
    # rather than buying hits. All jobs together get 10 GB, and a new entry is
    # written before prune-ccache removes the superseded one, so the figure
    # that has to fit is two generations: about 5.5 GB apiece today, of which
    # these eighteen are 4.3 GB. That is already over the quota, as the twenty
    # shards at 200M were before them. At 300M the shards alone would be 5.4 GB
    # a generation and at 400M 7.2 GB, so 14.4 GB at peak. GitHub reclaims an
    # overage by evicting whatever was least recently used, which is never this
    # matrix -- it is the small entries belonging to everything else, and they
    # were duly evicted down to nothing. The cap only binds because of the
    # explicit cleanup below; left to itself ccache never applied it and each
    # shard saved its full slice.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 240M
      LLVM_PROFILE_FILE: ${{ github.workspace }}/profraw/%p.profraw
    name: unit-test-coverage-shard-${{ matrix.shard }}
    needs: [build-coverage-lib]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The instrumented objects this job compiles once exhausted the runner
      # disk outright (final link: "No space left on device"), and the tests it
      # then runs write a .profraw per process into the same filesystem, which
      # is its own way of running out (#2857): a shard that fills the disk
      # partway through dies with no ctest summary and no exit-code annotation,
      # leaving the tests it never reached indistinguishable from passing ones.
      # Reclaiming the ~20+ GB of preinstalled toolchains we do not use covers
      # both, and covers them once, where building and testing on separate
      # machines paid for it twice.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          large-packages: false
          swap-storage: false
          tool-cache: false
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
        with:
          stagger-index: ${{ matrix.shard }}
      - name: Install ccache and Ninja
        run: sudo apt-get install -y ccache ninja-build
      - name: Download prebuilt library
        uses: actions/download-artifact@v4
        with:
          name: build-coverage-lib
          path: .
      - name: Unpack the build tree
        run: |
          mkdir -p build
          tar -C build -xf build.tar
          rm build.tar
      # The tar restores the modification times the tree was packed with, and
      # those predate this job's own checkout, so every object in the artifact
      # reads as older than the source it was compiled from. Left alone the
      # build recompiles the src/ tree the artifact exists to supply, and
      # regenerates the build system for all 2,700-odd unit-test targets. The
      # artifact was built from this very commit, so nothing in it can
      # legitimately be out of date, and the fix is to make the sources say so.
      #
      # The sources are stamped into the past rather than the tree into the
      # present, because Ninja does not read the mtime of the object on disk.
      # It compares two mtimes it recorded when it built that object -- one in
      # .ninja_log for the object, one in .ninja_deps for the headers the
      # object was found to depend on -- against those inputs as they stand
      # now, and both recordings were made on the machine that packed the tar,
      # minutes before this job checked its sources out. Touching the tree
      # forward leaves both records untouched and every src/ object dirty;
      # `ninja -t restat` rewrites the first log but has nothing to say about
      # the second, which is why it cleaned the dependency scans and left the
      # 283 compiles behind them. Dating the sources before the artifact was
      # packed satisfies every such comparison at once, whichever log holds it.
      - name: Stamp the sources as older than the prebuilt tree
        run: |
          find . \( -path ./build -o -path ./.git -o -path ./.ccache \) \
            -prune -o -print0 |
            xargs -0 touch -d '2001-01-01T00:00:00Z'
      # The key prefix names no job, and deliberately so: prune-ccache selects
      # what it retires with test("^(ccache-build-|ctcache-)"), so a prefix
      # renamed to match this job would fall outside that filter and these
      # eighteen entries would gain a generation per commit with nothing ever
      # removing them.
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          key: >-
            ccache-build-coverage-shard-${{
            matrix.shard }}-${{
            hashFiles('**/CMakeLists.txt') }}-${{
            github.sha }}
          path: .ccache
          restore-keys: |
            ccache-build-coverage-shard-${{
              matrix.shard }}-
            ccache-build-coverage-
      # ccache keeps its counters inside the cache directory, so the restore
      # above brings back every earlier run's totals and `ccache -s` would
      # report a lifetime average. Zero them so the figure describes this run.
      - name: Reset ccache statistics
        run: ccache --zero-stats
      # The compiler, its launcher and the coverage flags all come from the
      # CMake cache inside the downloaded tree, so this shard configures
      # nothing: it compiles its slice of the unit tests and links each one
      # against the library build-coverage-lib already archived.
      - name: Build
        run: |
          targets=$(grep -oP 'add_unit_test\(\K[^)]+' \
            test/CMakeLists.txt \
            | awk "(NR-1) % 18 == ${{ matrix.shard }}")
          cmake --build build --parallel 4 --target $targets
      # ccache evicts only on the path that stores a new object, so a job that
      # got a hit for every compilation never applies CCACHE_MAXSIZE at all: it
      # restores whatever the last run saved, adds nothing, and saves the lot
      # back, over the cap and unremarked. This matrix is where that was caught
      # and where it costs the most -- a shard whose slice was a clean 139 of 139
      # hits reported "Cache size (GB): 0.4 / 0.2 (199.9%)" and saved all 396 MB
      # of it under a 200M cap, once per shard in the one run. A cap that binds
      # only when something misses is not a cap, and the cache quota is shared
      # across every job in the repository, so evict explicitly and let the entry
      # this job saves honour its configured size whether or not anything missed.
      # Cleanup leaves the hit and miss counters alone, so the report below still
      # describes this build while the size it prints is the size that gets saved.
      - name: Trim ccache to its size limit
        run: ccache --cleanup
      # The hit rate decides whether the job rebuilds from scratch, so record it
      # rather than inferring it from the build duration.
      - name: Report ccache statistics
        run: ccache -s
      # The objects are dead once the executables above are linked, and the
      # tests below write a .profraw per process into this same filesystem.
      # Deleting them used to be a way to shrink an artifact for the journey to
      # another machine; with the tests in this job it is a way to free the disk
      # they are about to need.
      - name: Slim build output
        run: find build -name '*.o' -delete
      # Reported before and after so a shard that dies mid-run leaves evidence
      # of how much room it had, rather than only the silence it dies in.
      - name: Report free space before tests
        run: df -h /
      - name: Unit tests
        run: >-
          ctest --test-dir build --output-on-failure
          --label-exclude e2e --timeout 60
          --exclude-regex '_NOT_BUILT'
      - if: always()
        name: Report free space after tests
        run: df -h /
      - name: Upload profraw
        uses: actions/upload-artifact@v4
        with:
          name: profraw-unit-shard-${{ matrix.shard }}
          path: profraw/
          retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        shard: ['00', '01', '02', '03', '04', '05', '06', '07', '08', '09',
                '10', '11', '12', '13', '14', '15', '16', '17']
