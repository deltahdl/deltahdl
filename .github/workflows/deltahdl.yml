      - name: Check formatting
        run: |
          find src test lib/cpp -name '*.cpp' -o -name '*.h' | \
            xargs clang-format \
            --dry-run --Werror --style=google
  clang-include-cleaner-headers:
    name: clang-include-cleaner-headers-shard-${{ matrix.shard }}
    needs: [cache-googletest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
        with:
          packages: clang-@MAJOR@ clang-tools-@MAJOR@
      - name: Fetch googletest
        uses: ./.github/actions/fetch-googletest
        with:
          sha256: ${{ needs.cache-googletest.outputs.archive-sha256 }}
          tag: ${{ needs.cache-googletest.outputs.tag }}
      - name: Generate compile_commands.json
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: >-
          List this shard's headers (shard ${{ matrix.shard }}/${{
          strategy.job-total }})
        run: |
          find src lib/cpp -name '*.h' -not -path src/simulator/vpi_user.h |
            sort |
            awk -v n=${{ strategy.job-total }} -v s=${{ matrix.shard }} \
              "$SHARD_SLICE" > "$RUNNER_TEMP/headers"
          wc -l < "$RUNNER_TEMP/headers"
      - name: Write a compile command for every header of the shard
        run: |
          mkdir -p build/headers
          jq '
            (map(select(.file | test("/test/src/unit/.*\\.cpp$")))[0]) as $tu
            | [ $ARGS.positional[]
                | { directory: $tu.directory,
                    file: .,
                    command: (($tu.command | sub(" -o \\S+ -c \\S+$"; ""))
                              + " -x c++ -c " + .) } ]
          ' build/compile_commands.json \
            --args $(sed "s#^#$PWD/#" "$RUNNER_TEMP/headers") \
            > build/headers/compile_commands.json
          jq length build/headers/compile_commands.json
      - name: Check every header of the shard includes what it uses and only that
        run: |
          xargs -r -P "$(nproc)" -n 1 sh -c '
            out=$(clang-include-cleaner -p build/headers --print=changes "$0" 2>&1)
            status=$?
            printf "%s\n" "$out"
            if [ -n "$out" ] || [ "$status" -ne 0 ]; then
              echo "::error file=$0::$0: includes do not match uses"
              exit 1
            fi
            echo "$0: includes match uses"' < "$RUNNER_TEMP/headers"
    strategy:
      fail-fast: false
      matrix:
        shard: ['00', '01', '02', '03', '04', '05', '06', '07', '08', '09',
                '10', '11', '12', '13', '14', '15', '16']
  clang-tidy-src:
    env:
      CTCACHE_DIR: ${{ github.workspace }}/.ctcache
    if: ${{ !cancelled() }}
    name: clang-tidy-src-shard-${{ matrix.shard }}
    needs: clang-include-cleaner-headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
      - name: Install ctcache
        uses: ./.github/actions/install-ctcache
      - name: Create clang-tidy wrapper
        run: |
          sudo tee /usr/local/bin/clang-tidy-cached << 'WRAPPER'
          #!/bin/bash
          exec clang-tidy-cache /usr/bin/clang-tidy "${@}"
          WRAPPER
          sudo chmod +x /usr/local/bin/clang-tidy-cached
      - name: Restore ctcache
        uses: actions/cache@v5
        with:
          key: >-
            ctcache-src-${{ matrix.shard }}-${{
            hashFiles('etc/clang_tidy/src.yml') }}-${{
            github.sha }}
          path: .ctcache
          restore-keys: |
            ctcache-src-${{ matrix.shard }}-
      - name: Generate compile_commands.json
        run: |
          cmake -B build \
            -DBUILD_TESTING=OFF \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: >-
          Run clang-tidy (src, shard ${{ matrix.shard }}/${{
          strategy.job-total }})
        run: |
          regex=$(jq -r '.[].file' build/compile_commands.json \
            | grep -v '/test/' \
            | grep '\.cpp$' \
            | sort \
            | awk -v n=${{ strategy.job-total }} -v s=${{ matrix.shard }} \
              "$SHARD_SLICE" \
            | sed 's/\./\\./g' \
            | sed 's/$/$/' \
            | paste -sd'|')
          if [ -z "$regex" ]; then
            echo "Shard ${{ matrix.shard }} has no source files to lint."
            exit 0
          fi
          run-clang-tidy -p build \
            -j "$(nproc)" \
            -clang-tidy-binary /usr/local/bin/clang-tidy-cached \
            -config-file=etc/clang_tidy/src.yml \
            -extra-arg=-ferror-limit=0 \
            -extra-arg=-w \
            -warnings-as-errors='*' \
            "($regex)"
    strategy:
      fail-fast: false
      matrix:
        shard: ['00', '01', '02', '03', '04', '05', '06', '07', '08', '09',
                '10', '11', '12', '13', '14', '15', '16']
  clang-tidy-test:
