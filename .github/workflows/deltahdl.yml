        name: Look up sv-tests cache
        uses: actions/cache/restore@v5
        with:
          key: sv-tests-with-libraries-${{ steps.sv-tests-ref.outputs.sha }}
          lookup-only: true
          path: third_party/sv-tests
      - if: >-
          steps.sv-tests-lookup.outputs.cache-hit
          != 'true'
        name: Clone sv-tests
        run: |
          git clone --progress --depth 1 \
            https://github.com/chipsalliance/sv-tests.git \
            third_party/sv-tests
          git -C third_party/sv-tests submodule update --init --progress --depth 1 \
            third_party/tests/uvm third_party/tests/uvm-1.2
      - if: >-
          steps.sv-tests-lookup.outputs.cache-hit
          != 'true'
        name: Save sv-tests cache
        uses: actions/cache/save@v5
        with:
          key: sv-tests-with-libraries-${{ steps.sv-tests-ref.outputs.sha }}
