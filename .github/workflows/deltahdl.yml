          key: >-
            ccache-build-gcc-release-shard-${{
            matrix.shard }}-${{
            hashFiles('**/CMakeLists.txt') }}-${{
            github.sha }}
          path: .ccache
          restore-keys: |
            ccache-build-gcc-release-shard-${{
              matrix.shard }}-
            ccache-build-gcc-release-
