  cache-googletest:
    outputs:
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
      tag: ${{ steps.release.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        id: release
        name: Get latest googletest release
        run: >-
          echo "tag=$(gh api repos/google/googletest/releases/latest
          --jq .tag_name)"
          >> "$GITHUB_OUTPUT"
      - name: Restore googletest cache
        uses: actions/cache@v5
        with:
          key: googletest-${{ steps.release.outputs.tag }}
          path: .deps
      - env:
          TAG: ${{ steps.release.outputs.tag }}
        id: archive
        name: Download the googletest archive if the cache did not hold it
        run: |
          set -euo pipefail
          archive="${GITHUB_WORKSPACE}/.deps/googletest-${TAG}.tar.gz"
          mkdir -p "$(dirname "${archive}")"
          if [ ! -f "${archive}" ]; then
            curl --fail --location --show-error \
              --retry 8 --retry-all-errors --retry-delay 5 \
              --retry-max-time 600 --output "${archive}" \
              "https://github.com/google/googletest/archive/refs/tags/${TAG}.tar.gz"
          fi
          echo "sha256=$(sha256sum "${archive}" | cut -d" " -f1)" \
            >>"$GITHUB_OUTPUT"
