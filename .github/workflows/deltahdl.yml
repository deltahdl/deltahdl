          # The lint covers the clang-tidy configurations as well as this
          # workflow, so a change to either makes it necessary.
          PATTERN='^(\.github/workflows/deltahdl\.yml|etc/clang_tidy/)'
          if grep -qE "$PATTERN" changed-files.txt; then
            necessary=true
          else
            necessary=false
          fi
          echo "yamllint-necessary=$necessary" | tee -a "$GITHUB_OUTPUT"
  # The twelve integration and e2e jobs below each test the jobs they need
