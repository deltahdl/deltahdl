  unit-test-coverage:
    env:
      CCACHE_COMPRESSLEVEL: '10'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: '0'
      LLVM_PROFILE_FILE: ${{ github.workspace }}/profraw/%m.profraw
    if: ${{ !cancelled() && needs.build-coverage-lib.result == 'success' }}
    name: unit-test-coverage-shard-${{ matrix.shard }}
    needs: [build-coverage-lib, clang-tidy-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
        with:
          major: ${{ needs.build-coverage-lib.outputs.llvm-major }}
          packages: >-
            clang-@MAJOR@ lld-@MAJOR@ llvm-@MAJOR@ libclang-rt-@MAJOR@-dev
      - name: Install ccache and Ninja
        run: sudo apt-get install -y ccache ninja-build
      - name: Download prebuilt library
        uses: actions/download-artifact@v8
        with:
          name: build-coverage-lib
          path: .
      - name: Unpack the build tree
        run: |
          mkdir -p build
          tar -C build -xf build.tar
          rm build.tar
      - name: Stamp the sources as older than the prebuilt tree
        run: |
          find . \( -path ./build -o -path ./.git -o -path ./.ccache \) \
            -prune -o -print0 |
            xargs -0 touch -d '2001-01-01T00:00:00Z'
      - id: ccache
        name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          key: >-
            ccache-build-coverage-shard-${{
            matrix.shard }}-${{
            hashFiles('**/CMakeLists.txt') }}-${{
            github.sha }}
          path: .ccache
          restore-keys: |
            ccache-build-coverage-shard-${{
              matrix.shard }}-
            ccache-build-coverage-
      - name: Reset ccache statistics
        run: |
          ccache --zero-stats
          date +%s > "$RUNNER_TEMP/ccache-epoch"
      - name: Build
        run: |
          targets=$(grep -oP 'add_unit_test\(\K[^)]+' \
            test/CMakeLists.txt \
            | awk -v n=${{ strategy.job-total }} -v s=${{ matrix.shard }} \
              "$SHARD_SLICE")
          cmake --build build --parallel 4 --target $targets
      - name: Report free space after the build
        run: df -h /
      - if: ${{ always() && steps.ccache.outputs.cache-primary-key != '' }}
        name: Report the ccache size the build left
        run: du -sk "$CCACHE_DIR"
      - if: ${{ success() && steps.ccache.outputs.cache-primary-key != '' }}
        name: Evict what the build did not use
        run: |
          age=$(( $(date +%s) - $(cat "$RUNNER_TEMP/ccache-epoch") + 5 ))
          echo "Evicting entries unused for the last ${age} seconds"
          ccache --evict-older-than "${age}s"
      - if: ${{ always() && steps.ccache.outputs.cache-primary-key != '' }}
        name: Report ccache statistics
        run: |
          ccache -s
          du -sk "$CCACHE_DIR"
      - if: ${{ always() && steps.ccache.outputs.cache-primary-key != '' }}
        name: Save ccache
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: .ccache
      - name: Slim build output
        run: find build -name '*.o' -delete
      - name: Report free space before tests
        run: df -h /
      - name: Seed profile pools
        uses: ./.github/actions/seed-profile-pools
        with:
          images: build/test/test_*
      - name: Unit tests
        run: >-
          ctest --test-dir build --verbose
          --label-exclude e2e --timeout 60
          --exclude-regex '_NOT_BUILT'
      - if: always()
        name: Report free space after tests
        run: df -h /
      - name: Merge profraw
        uses: ./.github/actions/merge-profiles
        with:
          output: unit-shard-${{ matrix.shard }}.profdata
          paths: profraw/*.profraw
      - name: Upload profdata
        uses: actions/upload-artifact@v7
        with:
          name: profdata-unit-shard-${{ matrix.shard }}
          path: unit-shard-${{ matrix.shard }}.profdata
          retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        shard: ['00', '01', '02', '03', '04', '05', '06', '07', '08', '09',
                '10', '11', '12', '13', '14', '15', '16']
