  # Nothing is held behind this job. documentation.yml puts its jsonlint and
  # markdownlint behind its yamllint, on the argument that a linter is only as
  # trustworthy as the file defining it, but that argument covers every
  # scanning job in this workflow, and acting on it would let a YAML breach
  # leave the formatting check, the length cap, the assertions and the
  # copy-paste detectors recorded neither green nor red. A job that did not run
  # reports nothing. Each scan stands on its own instead.
  yamllint:
    needs: concluding-yamllint-necessary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/deltahdl.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/deltahdl.yml \
            etc/clang_tidy/*.yml
name: deltahdl
on:
  push:
    branches: [main]
    paths:
      - .github/actions/**
      - .github/workflows/deltahdl.yml
      - CMakeLists.txt
      - etc/**
      - lib/cpp/**
      # The programs this workflow's integration and e2e jobs run. Without
      # these, a change to a test runner is exercised only by its own unit
      # tests and never by the tier that runs it.
      - lib/python/run_tests_common/**
      - scripts/run_sim_tests/**
      - scripts/run_sv_tests/**
      - src/**
      - test/CMakeLists.txt
      - test/src/**
  workflow_dispatch:
