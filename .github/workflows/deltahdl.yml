---
concurrency:
  cancel-in-progress: true
  group: deltahdl-${{ github.ref_name }}
jobs:
  assert-coverage:
    needs: e2e-test-coverage
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download simulator
        uses: actions/download-artifact@v4
        with:
          name: coverage-simulator
          path: build/src/
      - name: Download unit profraw
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: profraw/unit/
          pattern: profraw-unit-shard-*
      - name: Download e2e profraw
        uses: actions/download-artifact@v4
        with:
          name: profraw-e2e
          path: profraw/e2e/
      - name: Download integration profraw
        uses: actions/download-artifact@v4
        with:
          name: profraw-integration
          path: profraw/integration/
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
      # Under coverage deltahdl_lib is a shared library, so the executable
      # carries the instrumentation for main.cpp and the library carries it for
      # everything else. llvm-cov reads coverage mapping out of the images it is
      # handed, so both have to be named or src/ reports as absent rather than
      # as uncovered.
      - name: Generate coverage report
        run: |
          llvm-profdata merge -sparse \
            profraw/unit/*.profraw \
            profraw/e2e/*.profraw \
            profraw/integration/*.profraw \
            -o merged.profdata
          llvm-cov show build/src/deltahdl \
            -object build/src/libdeltahdl_lib.so \
            -instr-profile=merged.profdata \
            --ignore-filename-regex='test/|third_party/' \
            --format=html \
            -output-dir=coverage-html
      # DO NOT lower this threshold. Uncovered code is untested code —
      # lowering it hides bugs and lets regressions slip through silently.
      - name: Enforce 100% coverage
        run: |
          llvm-cov report build/src/deltahdl \
            -object build/src/libdeltahdl_lib.so \
            -instr-profile=merged.profdata \
            --ignore-filename-regex='test/|third_party/'
          llvm-cov export build/src/deltahdl \
            -object build/src/libdeltahdl_lib.so \
            -instr-profile=merged.profdata \
            --ignore-filename-regex='test/|third_party/' \
            --summary-only \
            | jq -e '.data[0].totals |
              .lines.covered == .lines.count and
              .branches.covered == .branches.count' \
            || { echo "FAIL: coverage must be 100%"; exit 1; }
      - if: >-
          github.ref_name == 'main'
          && github.event_name == 'push'
        name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage-html/
      # DO NOT add continue-on-error here. If Pages deployment fails,
      # the repo settings need to be fixed (Settings > Pages > Source =
      # "GitHub Actions"), not the workflow.
      - if: >-
          github.ref_name == 'main'
          && github.event_name == 'push'
        name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
  # A unit test runs only if it has a TEST(...) block and test/CMakeLists.txt
  # registers it, and registration is by hand. This job and
  # assert-every-test-file-is-registered hold the two ends of that together, so
  # adding a test and deleting one both have to touch the file and its entry in
  # the same commit.
  #
  # An entry naming a file that is gone breaks configuration outright, so the
  # build catches it in any case and this job only catches it sooner and
  # without a toolchain.
  assert-every-registration-has-a-test-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every registration has a test file
        run: |
          fail=0
          for name in $(sed -nE 's/^add_unit_test\(([A-Za-z0-9_]+)\).*/\1/p' \
            test/CMakeLists.txt)
          do
            if [ ! -f "test/src/unit/$name.cpp" ]; then
              echo "::error file=test/CMakeLists.txt::registers $name, but" \
                "test/src/unit/$name.cpp does not exist"
              fail=1
            fi
          done
          exit $fail
  # A source with no add_unit_test(...) entry is never compiled, so it can sit
  # in the tree for months while its cases are assumed to be running. No other
  # job in this workflow catches that.
  assert-every-test-file-is-registered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every test file is registered
        run: |
          fail=0
          for f in test/src/unit/*.cpp
          do
            name=$(basename "$f" .cpp)
            if ! grep -qxF "add_unit_test($name)" test/CMakeLists.txt; then
              echo "::error file=$f::$f is never built; add" \
                "add_unit_test($name) to test/CMakeLists.txt, or delete" \
                "the file"
              fail=1
            fi
          done
          exit $fail
  # Each unit test source compiles into an executable of its own, and
  # gtest_discover_tests registers every case into CTest under the bare
  # Suite.Name with no binary to qualify it. Two files declaring one name
  # therefore produce two CTest tests called the same thing: --gtest_filter and
  # ctest -R select both, and a failure report names the suite and the test but
  # not the file, so a red run does not say which declaration broke. The scan
  # below spans the newline between the suite and the test name, because
  # clang-format wraps a long declaration at the comma and a line-at-a-time
  # grep would not see those.
  assert-no-duplicate-test-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check no unit test name is declared twice
        run: |
          names=$(mktemp)
          for f in test/src/unit/*.cpp
          do
            tr '\n' ' ' < "$f" \
              | grep -oE '(TYPED_)?TEST(_[FP])?\([A-Za-z0-9_]+ *, *[A-Za-z0-9_]+ *\)' \
              | sed -E 's/^.*\(([A-Za-z0-9_]+) *, *([A-Za-z0-9_]+) *\)$/\1.\2/' \
              | sed "s|\$| $f|"
          done | sort > "$names"
          fail=0
          for name in $(cut -d' ' -f1 "$names" | sort | uniq -d)
          do
            echo "::error::$name is declared more than once, in:" \
              "$(grep "^$name " "$names" | cut -d' ' -f2 | tr '\n' ' ')--" \
              "give each declaration a name stating its own claim, or" \
              "delete the redundant one"
            fail=1
          done
          exit $fail
  # A source that has lost its last TEST(...) block builds an executable that
  # observes nothing.
  assert-no-empty-test-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check no test file is empty of tests
        run: |
          fail=0
          for f in $(find test/src -name '*.cpp')
          do
            if ! grep -qE '^(TYPED_)?TEST(_[FP])?\(' "$f"; then
              echo "::error file=$f::$f has no TEST(...) blocks; delete the" \
                "file and its add_unit_test(...) entry"
              fail=1
            fi
          done
          exit $fail
  # DO NOT disable this job. Inline suppression comments (NOLINT,
  # clang-format off, etc.) hide problems instead of fixing them and make the
  # codebase progressively harder to maintain.
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/deltahdl.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-inline-directives
        run: pip install assert-no-inline-directives
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools clang-tidy,clang-format,clang-diagnostic
          ${{ github.workspace }}
  # DO NOT disable this job. A pylint, mypy or yamllint configuration file in
  # the tree relaxes a rule for every file it covers, and it does so where
  # nobody reading the job that runs the linter would see it. The settings each
  # linter runs under are written into the command that runs it instead.
  #
  # scripts.yml runs this same scan over the same workspace. The two workflows
  # watch different paths, so a push touching only src/ starts this one and not
  # that one, and neither copy covers what the other does.
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/deltahdl.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-linter-config-files
        run: pip install assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
  assert-no-oversized-source-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check file line limits
        run: |
          fail=0
          for f in $(find src test -name '*.cpp' -o -name '*.h')
          do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$f,line=1001::$f has $lines lines (max 1000)"
              fail=1
            fi
          done
          exit $fail
  build-asan-ubsan:
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    name: build-asan-ubsan-shard-${{ matrix.shard }}
    needs: [assert-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
        with:
          stagger-index: ${{ matrix.shard }}
      - name: Install ccache
        run: sudo apt-get install -y ccache
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          key: >-
            ccache-build-asan-ubsan-shard-${{
            matrix.shard }}-${{
            hashFiles('**/CMakeLists.txt') }}-${{
            github.sha }}
          path: .ccache
          restore-keys: |
            ccache-build-asan-ubsan-shard-${{
              matrix.shard }}-
            ccache-build-asan-ubsan-
      # ccache keeps its counters inside the cache directory, so the restore
      # above brings back every earlier run's totals and `ccache -s` would
      # report a lifetime average. Zero them so the figure describes this run.
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDELTAHDL_SANITIZERS=ON
          cmake --build build --parallel 4 --target deltahdl
          targets=$(grep -oP 'add_unit_test\(\K[^)]+' \
            test/CMakeLists.txt \
            | awk "(NR-1) % 5 == ${{ matrix.shard }}")
          cmake --build build --parallel 4 --target $targets
      # ccache evicts only on the path that stores a new object, so a job that
      # got a hit for every compilation never applies CCACHE_MAXSIZE at all: it
      # restores whatever the last run saved, adds nothing, and saves the lot
      # back, over the cap and unremarked. A cap that binds only when something
      # misses is not a cap, and the cache quota is shared across every job in
      # the repository, so evict explicitly and let the entry this job saves
      # honour its configured size whether or not anything missed. Cleanup leaves
      # the hit and miss counters alone, so the report below still describes this
      # build while the size it prints is the size that actually gets saved.
      - name: Trim ccache to its size limit
        run: ccache --cleanup
      # The hit rate decides whether the job rebuilds from scratch, so record it
      # rather than inferring it from the build duration.
      - name: Report ccache statistics
        run: ccache -s
      - name: Slim build output
        run: find build -name '*.o' -delete
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-asan-ubsan-shard-${{ matrix.shard }}
          path: build/
          retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
  build-coverage-lib:
    # Every coverage shard compiled the whole instrumented deltahdl target
    # before its slice of the unit tests, so the same 284 translation units
    # were compiled once per shard a run and stored once per shard in the cache.
    # Compile them once here and hand the shards the object tree.
    #
    # 284 instrumented src/ objects measure ~70 MB, a quarter of a megabyte
    # apiece, so this asks for the same 200M the other single-build jobs use. The
    # 400M it was first given reported "Cache size (GB): 0.1 / 0.4 (17.50%)" --
    # five times the space it needs, held against a quota the whole repository
    # shares.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The coverage build emits heavily instrumented objects that exhausted the
      # runner disk (final link: "No space left on device"). Reclaim the ~20+ GB
      # of preinstalled toolchains we do not use before building.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          large-packages: false
          swap-storage: false
          tool-cache: false
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
      - name: Install ccache and Ninja
        run: sudo apt-get install -y ccache ninja-build
      # The key prefix is deliberately not ccache-build-coverage-, which is the
      # last restore-key a shard falls back on. Sharing it would let a shard
      # restore this cache, which holds no unit-test objects at all.
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          key: >-
            ccache-build-lib-coverage-${{
            hashFiles('**/CMakeLists.txt') }}-${{
            github.sha }}
          path: .ccache
          restore-keys: |
            ccache-build-lib-coverage-${{ hashFiles('**/CMakeLists.txt') }}-
            ccache-build-lib-coverage-
      # ccache keeps its counters inside the cache directory, so the restore
      # above brings back every earlier run's totals and `ccache -s` would
      # report a lifetime average. Zero them so the figure describes this run.
      - name: Reset ccache statistics
        run: ccache --zero-stats
      # The generator chosen here is the one every coverage shard inherits, and
      # a shard asks for its whole slice in one cmake --build naming 137
      # targets. Make takes those as 137 separate goals and re-checks a build
      # system carrying 2,736 unit-test targets before each of them: 161 to 320
      # seconds of a shard's 290-to-494-second build step went on those checks,
      # with nothing compiling or linking, and --parallel had no two goals in
      # flight at once to overlap. Ninja scans the graph once and runs the whole
      # set four wide.
      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug \
            -DDELTAHDL_COVERAGE=ON
          cmake --build build --parallel 4 --target deltahdl
      # ccache evicts only on the path that stores a new object, so a job that
      # got a hit for every compilation never applies CCACHE_MAXSIZE at all: it
      # restores whatever the last run saved, adds nothing, and saves the lot
      # back. This job is the clearest case of it, reporting 284 hits out of 284
      # cacheable calls once warm, and a cap that binds only when something
      # misses is not a cap. The cache quota is shared across the whole
      # repository, so evict explicitly here and let the entry this job saves
      # honour its configured size either way. Cleanup leaves the hit and miss
      # counters alone, so the report below still describes this build while the
      # size it prints is the size that actually gets saved.
      - name: Trim ccache to its size limit
        run: ccache --cleanup
      # The hit rate decides whether the job rebuilds from scratch, so record it
      # rather than inferring it from the build duration.
      - name: Report ccache statistics
        run: ccache -s
      # The tree travels as a tar because actions/upload-artifact uploads a set
      # of files and so carries no empty directory, and a configured tree is
      # full of them: one object output directory per target nobody has built
      # yet, including the 2,700-odd unit-test targets and googletest's. A shard
      # that unpacked the lossy form died on the first of those, clang reporting
      # it could not open _deps/googletest-build/googletest/CMakeFiles/gtest.dir
      # /src/gtest-all.cc.o. The tar is left uncompressed for upload-artifact to
      # compress in transit.
      #
      # The object files travel with it, unlike every other build artifact here.
      # The build tool holds deltahdl_lib stale unless the objects it was linked
      # from are present, so slimming them out would have each shard recompile
      # the src/ tree this job exists to compile once. The tree is also left
      # configured, so a shard can build a target without re-running cmake over
      # every one of those unit-test targets.
      - name: Pack the build tree
        run: tar -C build -cf build.tar .
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-coverage-lib
          path: build.tar
          retention-days: 1
      # The instrumented simulator is all the coverage report and the sv-tests
      # and simulation suites need, and this job is where it is linked.
      # Publishing it on its own spares them the alternative: downloading a
      # coverage shard's whole build tree, 2.2 GB of unit-test executables, to
      # read the same tens of megabytes out of it. It travels beside the tar
      # rather than instead of it because the tar carries a configured tree with
      # its object files, which is a different thing for a different consumer.
      #
      # The library goes with it. Under coverage deltahdl_lib is shared, so it
      # holds the instrumentation for everything outside main.cpp: the simulator
      # will not start without it and llvm-cov has nothing to report from
      # without it either.
      - name: Upload simulator
        uses: actions/upload-artifact@v4
        with:
          name: coverage-simulator
          path: |
            build/src/deltahdl
            build/src/libdeltahdl_lib.so
          retention-days: 1
  build-macos-26-arm64-clang:
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 200M
    needs: [assert-coverage]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install ccache
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          key: >-
            ccache-build-macos-arm64-${{
            hashFiles('**/CMakeLists.txt') }}-${{
            github.sha }}
          path: .ccache
          restore-keys: |
            ccache-build-macos-arm64-${{ hashFiles('**/CMakeLists.txt') }}-
            ccache-build-macos-arm64-
      # ccache keeps its counters inside the cache directory, so the restore
      # above brings back every earlier run's totals and `ccache -s` would
      # report a lifetime average. Zero them so the figure describes this run.
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      # ccache evicts only on the path that stores a new object, so a job that
      # got a hit for every compilation never applies CCACHE_MAXSIZE at all: it
      # restores whatever the last run saved, adds nothing, and saves the lot
      # back, over the cap and unremarked. A cap that binds only when something
      # misses is not a cap, and the cache quota is shared across every job in
      # the repository, so evict explicitly and let the entry this job saves
      # honour its configured size whether or not anything missed. Cleanup leaves
      # the hit and miss counters alone, so the report below still describes this
      # build while the size it prints is the size that actually gets saved.
      - name: Trim ccache to its size limit
        run: ccache --cleanup
      # The hit rate decides whether the job rebuilds from scratch, so record it
      # rather than inferring it from the build duration.
      - name: Report ccache statistics
        run: ccache -s
      - name: Slim build output
        run: find build -name '*.o' -delete
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-macos-26-arm64-clang
          path: build/
          retention-days: 1
