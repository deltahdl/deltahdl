  prune-ccache:
    if: >-
      !cancelled()
      && github.ref_name == 'main'
      && github.event_name == 'push'
    needs:
      - build-asan-ubsan
      - build-macos-26-arm64-clang
      - build-tsan
      - build-ubuntu-24-04-x86-64-clang
      - build-ubuntu-24-04-x86-64-gcc
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        name: Delete superseded cache entries
        run: |
          keys=$(gh cache list --limit 1000 --json createdAt,key \
            --jq '.[] | select(.key | test("^(ccache-build-|ctcache-)"))
              | "\(.createdAt)\t\(.key)"' \
            | sort -r \
            | awk -F'\t' '{
                identity = $2
                sub(/-[^-]*-[^-]*$/, "", identity)
                if (identity in newest) print $2
                newest[identity] = 1
              }')
          for key in ${keys}; do
            echo "Deleting superseded cache entry: ${key}"
            gh cache delete "${key}" || echo "::warning::could not delete ${key}"
          done
  release:
    if: >-
      github.ref_name == 'main'
      && github.event_name == 'push'
    needs:
      - e2e-test-macos-26-arm64-clang
      - e2e-test-asan-ubsan
      - e2e-test-tsan
      - e2e-test-ubuntu-24-04-x86-64-clang
