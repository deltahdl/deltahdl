---
concurrency:
  cancel-in-progress: true
  group: deltahdl-${{ github.ref_name }}
jobs:
  assert-coverage:
    needs: e2e-test-coverage
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download simulator
        uses: actions/download-artifact@v4
        with:
          name: coverage-simulator
          path: build/src/
      # Each shard arrives already merged, having summed its own 2 to 3G of
      # .profraw into one file before uploading it. The files land in one
      # directory and keep the shard number in their names, so nothing
      # collides under merge-multiple.
      - name: Download unit profdata
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: profdata/unit/
          pattern: profdata-unit-shard-*
      - name: Download e2e profraw
        uses: actions/download-artifact@v4
        with:
          name: profraw-e2e
          path: profraw/e2e/
      - name: Download integration profraw
        uses: actions/download-artifact@v4
        with:
          name: profraw-integration
          path: profraw/integration/
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
      # The merge takes the unit tier already merged and the other two raw.
      # llvm-profdata reads a .profdata as readily as a .profraw and sums
      # counters either way, so the shard merges and the two raw sets give the
      # same profile the raw sets of every shard used to give.
      #
      # Under coverage deltahdl_lib is a shared library, so the executable
      # carries the instrumentation for main.cpp and the library carries it for
      # everything else. llvm-cov reads coverage mapping out of the images it is
      # handed, so both have to be named or src/ reports as absent rather than
      # as uncovered.
      - name: Generate coverage report
        run: |
          llvm-profdata merge -sparse \
            profdata/unit/*.profdata \
            profraw/e2e/*.profraw \
            profraw/integration/*.profraw \
            -o merged.profdata
          llvm-cov show build/src/deltahdl \
            -object build/src/libdeltahdl_lib.so \
            -instr-profile=merged.profdata \
            --ignore-filename-regex='test/|third_party/' \
            --format=html \
            -output-dir=coverage-html
      # DO NOT lower this threshold. Uncovered code is untested code —
      # lowering it hides bugs and lets regressions slip through silently.
      - name: Enforce 100% coverage
        run: |
          llvm-cov report build/src/deltahdl \
            -object build/src/libdeltahdl_lib.so \
            -instr-profile=merged.profdata \
            --ignore-filename-regex='test/|third_party/'
          llvm-cov export build/src/deltahdl \
            -object build/src/libdeltahdl_lib.so \
            -instr-profile=merged.profdata \
            --ignore-filename-regex='test/|third_party/' \
            --summary-only \
            | jq -e '.data[0].totals |
              .lines.covered == .lines.count and
              .branches.covered == .branches.count' \
            || { echo "FAIL: coverage must be 100%"; exit 1; }
      - if: >-
          github.ref_name == 'main'
          && github.event_name == 'push'
        name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage-html/
      # DO NOT add continue-on-error here. If Pages deployment fails,
      # the repo settings need to be fixed (Settings > Pages > Source =
      # "GitHub Actions"), not the workflow.
      - if: >-
          github.ref_name == 'main'
          && github.event_name == 'push'
        name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
  # A unit test runs only if it has a TEST(...) block and test/CMakeLists.txt
  # registers it, and registration is by hand. This job holds both ends of that
  # together, so adding a test and deleting one both have to touch the file and
  # its entry in the same commit.
  #
  # A source with no add_unit_test(...) entry is never compiled, so it can sit
  # in the tree for months while its cases are assumed to be running. No other
  # job in this workflow catches that. An entry naming a file that is gone
  # breaks configuration outright, so the build catches that one in any case
  # and this job only catches it sooner and without a toolchain.
  #
  # One reading of test/CMakeLists.txt answers both questions, and that is what
  # makes the guarantee hold: the two directions cannot disagree about what an
  # entry looks like when there is only one pattern that decides. Reading the
  # file twice let them disagree. The direction that checked registration
  # matched the whole line as a fixed string, so an entry written
  # add_unit_test(name)  # annex file, or one carrying trailing whitespace,
  # was an entry CMake honours and the other direction reads but this one
  # reported as missing -- and the report then asked for an entry that was
  # already there, or for the deletion of a file that was compiling and
  # running.
  #
  # The pattern below is the permissive one, matching what CMake accepts.
  # A name comes from a file under test/src/unit/ or from that pattern, so it
  # is [A-Za-z0-9_]+ either way and sorts and compares as a plain word. LC_ALL
  # is set because comm reads the two lists under the collation of the locale
  # it runs in, and a locale that folds case or ignores the underscore orders
  # those names differently from the sort that prepared them. The two have to
  # agree, or comm reports a difference where there is none.
  assert-file-and-registration-sets-agree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every test file is registered and every entry has a file
        run: |
          export LC_ALL=C
          registered=$(mktemp)
          sed -nE 's/^add_unit_test\(([A-Za-z0-9_]+)\).*/\1/p' \
            test/CMakeLists.txt | sort -u > "$registered"
          present=$(mktemp)
          for f in test/src/unit/*.cpp
          do
            f=${f##*/}
            echo "${f%.cpp}"
          done | sort -u > "$present"
          fail=0
          for name in $(comm -23 "$registered" "$present")
          do
            echo "::error file=test/CMakeLists.txt::registers $name, but" \
              "test/src/unit/$name.cpp does not exist"
            fail=1
          done
          for name in $(comm -13 "$registered" "$present")
          do
            echo "::error file=test/src/unit/$name.cpp::test/src/unit/$name.cpp" \
              "is never built; add add_unit_test($name) to" \
              "test/CMakeLists.txt, or delete the file"
            fail=1
          done
          exit $fail
  # Each unit test source compiles into an executable of its own, and
  # gtest_discover_tests registers every case into CTest under the bare
  # Suite.Name with no binary to qualify it. Two files declaring one name
  # therefore produce two CTest tests called the same thing: --gtest_filter and
  # ctest -R select both, and a failure report names the suite and the test but
  # not the file, so a red run does not say which declaration broke. The scan
  # below spans the newline between the suite and the test name, because
  # clang-format wraps a long declaration at the comma and a line-at-a-time
  # grep would not see those.
  assert-no-duplicate-test-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check no unit test name is declared twice
        run: |
          names=$(mktemp)
          for f in test/src/unit/*.cpp
          do
            tr '\n' ' ' < "$f" \
              | grep -oE '(TYPED_)?TEST(_[FP])?\([A-Za-z0-9_]+ *, *[A-Za-z0-9_]+ *\)' \
              | sed -E 's/^.*\(([A-Za-z0-9_]+) *, *([A-Za-z0-9_]+) *\)$/\1.\2/' \
              | sed "s|\$| $f|"
          done | sort > "$names"
          fail=0
          for name in $(cut -d' ' -f1 "$names" | sort | uniq -d)
          do
            echo "::error::$name is declared more than once, in:" \
              "$(grep "^$name " "$names" | cut -d' ' -f2 | tr '\n' ' ')--" \
              "give each declaration a name stating its own claim, or" \
              "delete the redundant one"
            fail=1
          done
          exit $fail
  # A source that has lost its last TEST(...) block builds an executable that
  # observes nothing.
  assert-no-empty-test-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check no test file is empty of tests
        run: |
          fail=0
          for f in $(find test/src -name '*.cpp')
          do
            if ! grep -qE '^(TYPED_)?TEST(_[FP])?\(' "$f"; then
              echo "::error file=$f::$f has no TEST(...) blocks; delete the" \
                "file and its add_unit_test(...) entry"
              fail=1
            fi
          done
          exit $fail
      # A header under lib/cpp/ reaches a test only by being included, and an
      # #include writes the basename. So a basename no source writes in an
      # #include is a file the compiler never opens: it is in no
      # translation unit, the coverage build never instruments it, and
      # clang-tidy never reads it, because clang-tidy takes its work from
      # compile_commands.json and that holds .cpp files. Nothing else in this
      # workflow can report such a header, which is how the sixteen deleted
      # under #2996 survived. Each lost its last #include when a later commit
      # rewrote the one test that included it.
      - name: Check every lib/cpp header is included somewhere
        run: |
          fail=0
          for f in $(find lib/cpp -name '*.h')
          do
            b=$(basename "$f")
            if ! grep -rqE "^#include \"([^\"]*/)?$b\"" src test lib/cpp; then
              echo "::error file=$f,line=1::$f is included by no source;" \
                "delete it or include it"
              fail=1
            fi
          done
          exit $fail
      # A helper in an included header is compiled, so this catches what the
      # step above cannot: a function the compiler does read and no test
      # calls. -Wunused-function does not report one, because every helper
      # here is declared inline and that warning covers static functions.
      #
      # The scan is by name rather than by call, since a helper can be named
      # without being called -- ReadOnceCb and ReadTwiceCb in
      # helpers_vpi_save_restore_probe.h are passed to the VPI registration
      # as function pointers. Requiring a following "(" would report both as
      # dead.
      #
      # A helper is alive on either of two counts: another file uses it, or
      # its own file does, below the line declaring it. Counting the second
      # is what keeps a helper written for one other helper in the same
      # header out of the report.
      - name: Check every lib/cpp helper is used outside its own declaration
        run: |
          fail=0
          for f in $(find lib/cpp -name '*.h')
          do
            names=$(grep -hoE \
              '^inline [A-Za-z_][A-Za-z0-9_:<>, &*]*[ &*][A-Za-z_][A-Za-z0-9_]*\(' \
              "$f" | sed -E 's/.*[ &*]([A-Za-z_][A-Za-z0-9_]*)\($/\1/')
            for n in $names
            do
              elsewhere=$(grep -rlw --include='*.cpp' --include='*.h' \
                "$n" src test lib/cpp | grep -vcx "$f" || true)
              here=$(grep -cw "$n" "$f")
              if [ "$elsewhere" -eq 0 ] && [ "$here" -le 1 ]; then
                echo "::error file=$f,line=1::$f declares $n and nothing" \
                  "uses it; delete it or use it"
                fail=1
              fi
            done
          done
          exit $fail
  # DO NOT disable this job. Inline suppression comments (NOLINT,
  # clang-format off, etc.) hide problems instead of fixing them and make the
  # codebase progressively harder to maintain.
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/deltahdl.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-inline-directives
        run: pip install assert-no-inline-directives
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools clang-tidy,clang-format,clang-diagnostic
          ${{ github.workspace }}
  # DO NOT disable this job. A pylint, mypy or yamllint configuration file in
  # the tree relaxes a rule for every file it covers, and it does so where
  # nobody reading the job that runs the linter would see it. The settings each
  # linter runs under are written into the command that runs it instead.
  #
  # scripts.yml runs this same scan over the same workspace. The two workflows
  # watch different paths, so a push touching only src/ starts this one and not
  # that one, and neither copy covers what the other does.
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/deltahdl.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-linter-config-files
        run: pip install assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
  assert-no-oversized-source-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check file line limits
        run: |
          fail=0
          for f in $(find src test lib/cpp -name '*.cpp' -o -name '*.h')
          do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$f,line=1001::$f has $lines lines (max 1000)"
              fail=1
            fi
          done
          exit $fail
  # This job fails when a file anywhere under src/ hands DiagEngine::Error or
  # DiagEngine::Warning an empty location: {}, SourceLoc{} or SourceLoc().
  # SourceManager::FormatLoc renders one as "<unknown location>" at
  # src/common/source_mgr.cpp:31, and DiagEngine::Emit then skips the source
  # line and the caret because there is no line to quote. A report given one
  # tells somebody whose source description was rejected what went wrong and
  # not where, and a source description holding several of the construct under
  # test produces one sentence with nothing to tell the failures apart.
  #
  # A report about the run rather than about a construct written in a source
  # description says so with SourceLoc::None(), declared at
  # src/common/source_loc.h:27. That value is what lets this job cover the
  # whole tree rather than src/simulator alone: a source description that
  # cannot be read has no position to stand at, and before #3006 the only way
  # to say so read the same as passing nothing.
  #
  # The scan joins each file into one line first, because clang-format wraps a
  # long report after the open parenthesis and a line-at-a-time grep would not
  # see a location on the next line. The pattern then reads the whole location
  # argument rather than its first token, so a location reached through a
  # conditional fails as readily as a literal standing first;
  # src/simulator/eval_function.cpp passed call ? call->range.start :
  # SourceLoc{} until #3006, inside the one directory this job already covered.
  # The span cannot cross a comma, a semicolon or a closing parenthesis, so it
  # never runs past the end of the location argument. That is also what keeps
  # a {} inside a format string from counting, since the message is a later
  # argument and a comma always stands between the open parenthesis and its
  # braces. SourceLoc{} needs no alternative of its own, because the braces
  # ending it are the {} the first alternative matches, and SourceLoc::None()
  # matches neither alternative, because it holds no {} and the text
  # SourceLoc() is not a substring of it.
  assert-no-unlocated-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check no diagnostic is reported at an empty location
        run: |
          fail=0
          for f in $(find src -name '*.cpp' -o -name '*.h')
          do
            if tr '\n' ' ' < "$f" \
              | grep -qE '(\.|->)(Error|Warning)\([^,;)]*(\{\}|SourceLoc\(\)) *,'
            then
              echo "::error file=$f,line=1::$f reports a diagnostic at an" \
                "empty location; pass the position of the construct the" \
                "report is about, which an Expr and a Stmt carry in" \
                "range.start and a ModuleItem carries in loc, or" \
                "SourceLoc::None() when the report is about the run rather" \
                "than about a construct"
              fail=1
            fi
          done
          exit $fail
  # A test that hands deltahdl an illegal source shows the rule it covers is
  # enforced only if it names the report: a substring of the message, the line
  # of the test's own source the report stands at, and the exact Subclause("…")
  # text the emission site passes, in one call to ReportedError in
  # lib/cpp/test_helpers/helpers_reported_error.h. EXPECT_TRUE(f.has_errors),
  # EXPECT_TRUE(f.diag.HasErrors()), EXPECT_FALSE(ParseOk(...)) and
  # EXPECT_EQ(..., CompileOutcome::kFailed) are each satisfied by any rejection,
  # so a test written for one rule passes when a different rule fired, and
  # passes when the source never reached the construct the test is about.
  # SinglePassPrecompile.DescriptionClaimedByTwoLibrariesNamesBothInItsDiagnostic
  # in test/src/unit/test_parser_subclause_33_05_01.cpp did exactly that until
  # 28234b4ac. #2961 states the defect in full, and the commits closing #3017,
  # #3018, #3019, #3020, #3021, #3088 and #3112 converted every site the tree
  # then held. This job is what keeps them converted: no test observes an
  # assertion another test file did not make, so nothing else can report a new
  # one written the old way.
  #
  # Two rules, because the four shapes are not equally wrong.
  #
  # EXPECT_TRUE or ASSERT_TRUE on has_errors, or on any name ending in
  # HasErrors(, names no report at all, so it fails wherever it stands. The
  # name is matched with a prefix so a file-local wrapper is caught too:
  # EXPECT_TRUE(LexHasErrors("…")) hid five such assertions in
  # test/src/unit/test_lexer_annex_a_08_08.cpp from the reading behind #3017.
  #
  # EXPECT_FALSE on a call ending in Ok(, and EXPECT_EQ against
  # CompileOutcome::kFailed, also stand as the outcome check beside a
  # ReportedError for the same run, which 6e204800b records as wanted. Those
  # two fail only in a TEST body that calls ReportedError nowhere.
  #
  # An assertion that a source was ACCEPTED reads the same members and is sound,
  # because the claim there is that nothing was reported and there is no report
  # to name. That is why every shape is anchored on the assertion macro:
  # EXPECT_FALSE(f.diag.HasErrors()) and EXPECT_TRUE(ParseOk(…)) have to pass a
  # scan that fails their opposites.
  #
  # The scan reads a TEST body rather than a line, and joins each file with
  # tr '\n' ' ' before it matches, because clang-format wraps an assertion whose
  # argument is a multi-line source string, and because the ReportedError call
  # answering an EXPECT_FALSE(ElabOk(…)) stands on a later line than the
  # assertion it answers. // comments are stripped first, so that a shape quoted
  # in a comment is not read as an assertion; a string literal holding // is
  # truncated by that, which can only hide a body from this scan, never invent
  # one.
  #
  # Eight bodies are exempt, and every one is sound as written. Six pin what a
  # fixture helper returns, which is the construct under test there rather than
  # a rule the source breaks, and each is paired with an acceptance of the same
  # call. Two sweep Table B.1 through a fixed template whose control run shows
  # the frame parses, and each word lands in a different parser path, so no one
  # message or subclause holds across the sweep. 6e204800b records both
  # readings.
  #
  # The list is here rather than in a marker comment in the sources, because an
  # inline marker hides the exemption where nobody reading this job would see
  # it, which is what assert-no-inline-directives exists to stop. Nothing else
  # belongs on it: an assertion that cannot name a report because the rule has
  # no report is a defect in the program, and it is fixed rather than exempted.
  # DefparamElaboration.RhsRejectsNonConstantExpression was the one such body,
  # and #3070 is what took it off this list.
  assert-no-unnamed-rejections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every rejection test names the report it rests on
        run: |
          fail=0
          for f in test/src/unit/*.cpp
          do
            found=$(sed 's|//.*||' "$f" | tr '\n' ' ' | awk -v f="$f" '
              BEGIN {
                sound["ElaboratorFixture.ElaborateSrcAllowingParseErrorsReportsWithoutFailing"] = 1
                sound["ElaboratorFixture.ElaborateWithPreprocessorAllowingParseErrorsReportsWithoutFailing"] = 1
                sound["ElaboratorHarness.ASourceTheElaboratorRejectsIsReportedAsRejected"] = 1
                sound["ElaboratorHarness.AnElaborationRejectionIsReadableByItsMessage"] = 1
                sound["ParserHarness.ParseOkTellsAnAcceptedSourceFromARejectedOne"] = 1
                sound["ParserHarness.ParseWithPreprocessorOkTellsAnAcceptedSourceFromARejected"] = 1
                sound["KeywordListParsing.NoReservedWordCanNameAVariable"] = 1
                sound["KeywordListParsing.NoReservedWordCanNameAnythingInAnyPosition"] = 1
              }
              {
                n = split($0, body, /[^A-Za-z0-9_](TYPED_)?TEST(_[FP])?\(/)
                for (i = 2; i <= n; i++) {
                  if (!match(body[i], /^[A-Za-z0-9_]+ *, *[A-Za-z0-9_]+ *\)/)) continue
                  name = substr(body[i], 1, RLENGTH)
                  sub(/ *, */, ".", name)
                  sub(/ *\)$/, "", name)
                  if (name in sound) continue
                  shape = ""
                  if (match(body[i], /(EXPECT|ASSERT)_TRUE\([A-Za-z0-9_.>:-]*(has_errors|HasErrors\()/)) {
                    shape = "an unqualified claim that some error was reported"
                  } else if (!index(body[i], "ReportedError")) {
                    if (match(body[i], /(EXPECT|ASSERT)_FALSE\([A-Za-z0-9_.>:-]*Ok\(/)) {
                      shape = "a false answer from a helper ending in Ok"
                    } else if (match(body[i], /(EXPECT|ASSERT)_EQ\([^;]*CompileOutcome::kFailed/)) {
                      shape = "a compile outcome of CompileOutcome::kFailed"
                    }
                  }
                  if (shape == "") continue
                  msg = "declares " name ", which claims deltahdl rejected a"
                  msg = msg " source on " shape " and names no report, so it"
                  msg = msg " passes when a different rule fired; name the"
                  msg = msg " message, the line and the subclause the emission"
                  msg = msg " site passes, in one call to ReportedError in"
                  msg = msg " lib/cpp/test_helpers/helpers_reported_error.h"
                  print "::error file=" f ",line=1::" f " " msg
                }
              }')
            if [ -n "$found" ]; then
              echo "$found"
              fail=1
            fi
          done
          exit $fail
  # Every report names the subclause of IEEE 1800-2023 whose rule it enforces,
  # and names it once. Two things can take that away, and this job fails on
  # either.
  #
  # A new emission site can say Subclause::Unread(), which is the word for a
  # site nobody has read against the standard. #2971 made the subclause a
  # required argument and #2975 through #2987 and #2966 read every site the
  # tree then held, so a site carrying it now is one that was added without
  # being read.
  #
  # A message can also spell out the subclause its own Subclause argument
  # carries. DiagEngine::Emit appends the field to the sentence, so such a
  # report prints the subclause twice, as the recursive-let report did until
  # #3002. A literal citing some other subclause is a cross-reference and is
  # left alone: src/parser/parser_sequence_local_var.cpp says "the types
  # allowed in §16.6" under Subclause("16.8.2"), and both are wanted.
  #
  # src/common/diagnostic.h and src/common/diagnostic.cpp are exempt because
  # they declare and write what is being checked: the header documents
  # Subclause::Unread() and DiagEngine::Emit writes the section sign every
  # report carries.
  #
  # The second check strips // comments before it reads a file, since the
  # comment above a report cites the subclause the report enforces and would
  # otherwise be read as the message doing so. A string literal holding // is
  # truncated by that, which can only hide a site from this check, never
  # invent one.
  assert-no-unread-subclause:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check no report leaves its subclause unread
        run: |
          fail=0
          for f in $(find src -name '*.cpp' -o -name '*.h')
          do
            case "$f" in
              src/common/diagnostic.h|src/common/diagnostic.cpp) continue ;;
            esac
            while IFS=: read -r line _
            do
              echo "::error file=$f,line=$line::$f:$line passes" \
                "Subclause::Unread(); read the site against ~/LRM.pdf and" \
                "name the subclause it enforces, or Subclause::None() if it" \
                "enforces no rule of the standard"
              fail=1
            done < <(grep -n 'Subclause::Unread()' "$f" || true)
          done
          exit $fail
      - name: Check no message repeats the subclause its own field carries
        run: |
          fail=0
          for f in $(find src -name '*.cpp' -o -name '*.h')
          do
            case "$f" in
              src/common/diagnostic.h|src/common/diagnostic.cpp) continue ;;
            esac
            dupes=$(sed 's|//.*||' "$f" | tr '\n' ' ' | awk '
              {
                rest = $0
                while (match(rest, /Subclause\("[0-9][0-9.]*"\)/)) {
                  call = substr(rest, 1, RSTART - 1)
                  arg = substr(rest, RSTART + 11, RLENGTH - 13)
                  parts = split(call, cited, "§")
                  for (i = 2; i <= parts; i++) {
                    num = cited[i]
                    sub(/[^0-9.].*$/, "", num)
                    sub(/\.$/, "", num)
                    if (num == arg) print arg
                  }
                  rest = substr(rest, RSTART + RLENGTH)
                }
              }')
            for num in $dupes
            do
              echo "::error file=$f,line=1::$f says §$num in a message whose" \
                "own Subclause argument is \"$num\", so DiagEngine::Emit" \
                "prints it twice; drop it from the sentence and leave it in" \
                "the field"
              fail=1
            done
          done
          exit $fail
