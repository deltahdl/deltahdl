      # above brings back every earlier run's totals and `ccache -s` would
      # report a lifetime average. Zero them so the figure describes this run.
      - name: Reset ccache statistics
        run: ccache --zero-stats
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --target deltahdl
          targets=$(grep -oP 'add_unit_test\(\K[^)]+' \
            test/CMakeLists.txt \
            | awk "(NR-1) % 5 == ${{ matrix.shard }}")
          cmake --build build --parallel 4 --target $targets
      # ccache evicts only on the path that stores a new object, so a job that
      # got a hit for every compilation never applies CCACHE_MAXSIZE at all: it
      # restores whatever the last run saved, adds nothing, and saves the lot
      # back, over the cap and unremarked. A cap that binds only when something
      # misses is not a cap, and the cache quota is shared across every job in
      # the repository, so evict explicitly and let the entry this job saves
      # honour its configured size whether or not anything missed. Cleanup leaves
      # the hit and miss counters alone, so the report below still describes this
      # build while the size it prints is the size that actually gets saved.
      - name: Trim ccache to its size limit
        run: ccache --cleanup
      # The hit rate decides whether the job rebuilds from scratch, so record it
      # rather than inferring it from the build duration.
      - name: Report ccache statistics
        run: ccache -s
      - name: Slim build output
        run: find build -name '*.o' -delete
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-ubuntu-24-04-x86-64-gcc-shard-${{ matrix.shard }}
          path: build/
          retention-days: 1
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
  # Ensures sv-tests is cached for integration-test jobs. Compares
  # the latest remote SHA against the SV_TESTS_SHA repo variable to
  # decide if a clone is needed. On warm cache (same SHA) this is a
  # fast no-op — no files are downloaded. On cold cache (new SHA,
  # ~daily) it clones once, saves to cache, and updates the variable.
  cache-sv-tests:
    needs:
      - unit-test-coverage
    outputs:
      sv-tests-sha: ${{ steps.sv-tests-ref.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - id: sv-tests-ref
        name: Get latest sv-tests commit
        run: >-
          echo "sha=$(git ls-remote
          https://github.com/chipsalliance/sv-tests.git
          HEAD | cut -f1)"
          >> "$GITHUB_OUTPUT"
      - if: >-
          steps.sv-tests-ref.outputs.sha
          != vars.SV_TESTS_SHA
        name: Clone sv-tests
        run: >-
          git clone --depth 1
          https://github.com/chipsalliance/sv-tests.git
          third_party/sv-tests
      - if: >-
          steps.sv-tests-ref.outputs.sha
          != vars.SV_TESTS_SHA
        name: Save sv-tests cache
        uses: actions/cache/save@v4
        with:
          key: sv-tests-${{ steps.sv-tests-ref.outputs.sha }}
          path: third_party/sv-tests
      - env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        if: >-
          steps.sv-tests-ref.outputs.sha
          != vars.SV_TESTS_SHA
        name: Update SV_TESTS_SHA variable
        run: >-
          gh variable set SV_TESTS_SHA
          --body "${{ steps.sv-tests-ref.outputs.sha }}"
          --repo "${{ github.repository }}"
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
      - name: Check formatting
        run: |
          find src test -name '*.cpp' -o -name '*.h' | \
            xargs clang-format \
            --dry-run --Werror --style=google
  clang-tidy-src:
    env:
      CTCACHE_DIR: ${{ github.workspace }}/.ctcache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
      - name: Install ctcache
        run: pip install git+https://github.com/matus-chochlik/ctcache.git
      - name: Create clang-tidy wrapper
        run: |
          sudo tee /usr/local/bin/clang-tidy-cached << 'WRAPPER'
          #!/bin/bash
          exec clang-tidy-cache /usr/bin/clang-tidy "${@}"
          WRAPPER
          sudo chmod +x /usr/local/bin/clang-tidy-cached
      - name: Restore ctcache
        uses: actions/cache@v5
        with:
          key: >-
            ctcache-src-${{
            hashFiles('etc/clang_tidy/src.yml') }}-${{
            github.sha }}
          path: .ctcache
          restore-keys: |
            ctcache-src-
      - name: Generate compile_commands.json
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # run-clang-tidy takes its positional argument as a Python regular
      # expression and searches it against each absolute path in
      # compile_commands.json, so the selection is written as one pattern over
      # those paths: every .cpp outside the test tree, which is what this
      # configuration lints. The negative lookahead keeps the exclusion on
      # /test/ rather than on any directory the sources happen to sit in today.
      - name: Run clang-tidy (src)
        run: |
          run-clang-tidy -p build \
            -j "$(nproc)" \
            -clang-tidy-binary /usr/local/bin/clang-tidy-cached \
            -config-file=etc/clang_tidy/src.yml \
            -extra-arg=-ferror-limit=0 \
            -extra-arg=-w \
            -warnings-as-errors='*' \
            '^(?!.*/test/).*\.cpp$'
  clang-tidy-test:
    env:
      CTCACHE_DIR: ${{ github.workspace }}/.ctcache
    name: clang-tidy-test-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
        with:
          stagger-index: ${{ matrix.shard }}
      - name: Install ctcache
        run: pip install git+https://github.com/matus-chochlik/ctcache.git
      - name: Create clang-tidy wrapper
        run: |
          sudo tee /usr/local/bin/clang-tidy-cached << 'WRAPPER'
          #!/bin/bash
          exec clang-tidy-cache /usr/bin/clang-tidy "${@}"
          WRAPPER
          sudo chmod +x /usr/local/bin/clang-tidy-cached
      - name: Restore ctcache
        uses: actions/cache@v5
        with:
          key: >-
            ctcache-test-${{ matrix.shard }}-${{
            hashFiles('etc/clang_tidy/test_src_unit.yml') }}-${{
            github.sha }}
          path: .ctcache
          restore-keys: |
            ctcache-test-${{ matrix.shard }}-
      - name: Generate compile_commands.json
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      # The positional argument is a Python regular expression searched against
      # each absolute path in compile_commands.json, so this shard's slice of
      # the unit test tree is named as an alternation of the paths awk left it.
      # The paths are whole rather than basenames, which keeps a source file
      # sharing a test file's basename out of a configuration written for the
      # tests. Only the dot is escaped: nothing else a path holds here means
      # anything to the regular expression engine, and $ anchors the match at
      # the end so no longer path can carry a slice member as a prefix.
      - name: Run clang-tidy (test, shard ${{ matrix.shard }}/17)
        run: |
          regex=$(jq -r '.[].file' build/compile_commands.json \
            | grep '/test/src/unit/.*\.cpp$' \
            | sort \
            | awk "NR % 17 == ${{ matrix.shard }}" \
            | sed 's/\./\\./g' \
            | sed 's/$/$/' \
            | paste -sd'|')
          run-clang-tidy -p build \
            -j "$(nproc)" \
            -clang-tidy-binary /usr/local/bin/clang-tidy-cached \
            -config-file=etc/clang_tidy/test_src_unit.yml \
            -extra-arg=-ferror-limit=0 \
            -extra-arg=-w \
            -warnings-as-errors='*' \
            "($regex)"
    strategy:
      fail-fast: false
      matrix:
        shard: ['00', '01', '02', '03', '04', '05',
                '06', '07', '08', '09', '10', '11',
                '12', '13', '14', '15', '16']
  # Exactly one of the two jobs below runs, so the run graph carries the
  # answer determining-yamllint reached as a node with a name on it. A step
  # deciding the same question inside the job that acts on it leaves no such
  # trace: the job is reported the same way whether the lint ran or not, and
  # reading which of the two happened means opening a log.
  concluding-yamllint-necessary:
    if: ${{ needs.determining-yamllint.outputs.yamllint-necessary == 'true' }}
    needs: determining-yamllint
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: 'true'
  concluding-yamllint-unnecessary:
    if: ${{ needs.determining-yamllint.outputs.yamllint-necessary == 'false' }}
    needs: determining-yamllint
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: 'true'
  copy-paste-src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        id: pmd
        name: Resolve latest PMD release
        run: |
          # The releases API is rate-limited per source IP, and shared runner
          # IPs exhaust the unauthenticated allowance readily, so the request
          # carries the workflow token and is retried with backoff -- the same
          # treatment the LLVM discovery in .github/actions/install-llvm needs
          # for the same reason.
          #
          # The result is checked here rather than left to the consumer. A bare
          # `ver=$(curl ...)` reports success even when the request 403s,
          # because command substitution discards curl's exit status, and the
          # empty version then reaches the download step as the URL
          # .../download/pmd_releases%2F/pmd-dist--bin.zip. That 404s, so the
          # job failed two steps later with a wget exit code and no mention of
          # the API call that actually went wrong.
          ver=""
          for attempt in 1 2 3 4 5; do
            resp=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/pmd/pmd/releases/latest) &&
              ver=$(echo "${resp}" | jq -r .tag_name |
                sed 's#pmd_releases/##')
            if echo "${ver}" | grep -qE '^[0-9]+\.[0-9]+'; then break; fi
            echo "::warning::PMD version discovery attempt ${attempt} failed;" \
              "retrying in $(( attempt * 5 ))s"
            sleep $(( attempt * 5 ))
          done
          if ! echo "${ver}" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "::error::could not resolve latest PMD release"
            exit 1
          fi
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
      - name: Restore PMD cache
        uses: actions/cache@v5
        with:
          key: pmd-${{ steps.pmd.outputs.ver }}
          path: pmd-bin-${{ steps.pmd.outputs.ver }}
      - name: Install PMD
        run: |
          PMD_VER="${{ steps.pmd.outputs.ver }}"
          if [ ! -d "pmd-bin-$PMD_VER" ]; then
            PMD="pmd-dist-$PMD_VER-bin.zip"
            URL=https://github.com/pmd/pmd/releases
            wget -q "$URL/download/pmd_releases%2F$PMD_VER/$PMD"
            unzip -q "$PMD"
          fi
          echo "$PWD/pmd-bin-$PMD_VER/bin" >> "$GITHUB_PATH"
      - name: Detect copy-paste in source (C++)
        run: >-
          pmd cpd
          --minimum-tokens 100
          --language cpp
          --dir src/
  copy-paste-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        id: pmd
        name: Resolve latest PMD release
        run: |
          # The releases API is rate-limited per source IP, and shared runner
          # IPs exhaust the unauthenticated allowance readily, so the request
          # carries the workflow token and is retried with backoff -- the same
          # treatment the LLVM discovery in .github/actions/install-llvm needs
          # for the same reason.
          #
          # The result is checked here rather than left to the consumer. A bare
          # `ver=$(curl ...)` reports success even when the request 403s,
          # because command substitution discards curl's exit status, and the
          # empty version then reaches the download step as the URL
          # .../download/pmd_releases%2F/pmd-dist--bin.zip. That 404s, so the
          # job failed two steps later with a wget exit code and no mention of
          # the API call that actually went wrong.
          ver=""
          for attempt in 1 2 3 4 5; do
            resp=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/pmd/pmd/releases/latest) &&
              ver=$(echo "${resp}" | jq -r .tag_name |
                sed 's#pmd_releases/##')
            if echo "${ver}" | grep -qE '^[0-9]+\.[0-9]+'; then break; fi
            echo "::warning::PMD version discovery attempt ${attempt} failed;" \
              "retrying in $(( attempt * 5 ))s"
            sleep $(( attempt * 5 ))
          done
          if ! echo "${ver}" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "::error::could not resolve latest PMD release"
            exit 1
          fi
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
      - name: Restore PMD cache
        uses: actions/cache@v5
        with:
          key: pmd-${{ steps.pmd.outputs.ver }}
          path: pmd-bin-${{ steps.pmd.outputs.ver }}
      - name: Install PMD
        run: |
          PMD_VER="${{ steps.pmd.outputs.ver }}"
          if [ ! -d "pmd-bin-$PMD_VER" ]; then
            PMD="pmd-dist-$PMD_VER-bin.zip"
            URL=https://github.com/pmd/pmd/releases
            wget -q "$URL/download/pmd_releases%2F$PMD_VER/$PMD"
            unzip -q "$PMD"
          fi
          echo "$PWD/pmd-bin-$PMD_VER/bin" >> "$GITHUB_PATH"
      - name: Detect copy-paste in tests (C++)
        run: >-
          pmd cpd
          --minimum-tokens 100
          --language cpp
          --dir test/src/
          --dir lib/cpp/
  determining-yamllint:
    outputs:
      yamllint-necessary: ${{ steps.decide.outputs.yamllint-necessary }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        name: Decide whether YAML linting is necessary
        run: |
          # A push names the commit its branch stood at beforehand, and that
          # is the only event with a base to name. A workflow_dispatch run
          # leaves this empty, which the fallback below answers by listing the
          # whole tree.
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          zero='0000000000000000000000000000000000000000'
          # Listing the whole tree is never wrong, only wasteful: it answers
          # yes on any push whose base is missing, zeroed or unreachable, and
          # that is what a workflow_dispatch run wants, since the tree holds
          # the files the pattern names.
          if [ -z "$base" ] || [ "$base" = "$zero" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git ls-files | tee changed-files.txt
          else
            git diff --name-only "$base" "$head" | tee changed-files.txt
          fi
          # The lint covers the clang-tidy configurations as well as this
          # workflow, so a change to either makes it necessary.
          PATTERN='^(\.github/workflows/deltahdl\.yml|etc/clang_tidy/)'
          if grep -qE "$PATTERN" changed-files.txt; then
            necessary=true
          else
            necessary=false
          fi
          echo "yamllint-necessary=$necessary" | tee -a "$GITHUB_OUTPUT"
  # The twelve integration and e2e jobs below each test the jobs they need
  # rather than the health of the run. !cancelled() supplies a status function
  # so a skipped need does not carry the skip onwards by default, and the
  # result tests put back exactly what the default condition provided: run when
  # what this job depends on succeeded, stay out when it did not.
  #
  # `!failure()` stood here before, and it is true only when nothing anywhere in
  # the run has failed. integration-test-coverage depends on nothing the unit
  # tier produces, and a red unit shard skipped it in every run for over a
  # hundred pushes; when it finally ran it reported 132 failing sv-tests that no
  # run in that window had said anything about. A job held back by a failure it
  # has no relation to reports nothing, and a job that did not run is recorded
  # neither green nor red, so the tier's state stopped being visible at exactly
  # the times it was most likely to be drifting.
  e2e-test-asan-ubsan:
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    if: ${{ !cancelled() && needs.integration-test-asan-ubsan.result == 'success' }}
    needs: integration-test-asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-asan-ubsan-shard-0
          path: build/
      - name: Fix permissions
        run: chmod +x build/src/deltahdl
      - name: E2E tests
        run: PYTHONPATH=.:scripts python3 -m run_sim_tests
  e2e-test-coverage:
    env:
      LLVM_PROFILE_FILE: ${{ github.workspace }}/profraw/%p.profraw
    if: ${{ !cancelled() && needs.integration-test-coverage.result == 'success' }}
    needs: integration-test-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download simulator
        uses: actions/download-artifact@v4
        with:
          name: coverage-simulator
          path: build/src/
      - name: Fix permissions
        run: chmod +x build/src/deltahdl
      - name: E2E tests
        run: PYTHONPATH=.:scripts python3 -m run_sim_tests
      - name: Upload profraw
        uses: actions/upload-artifact@v4
        with:
          name: profraw-e2e
          path: profraw/
          retention-days: 1
  e2e-test-macos-26-arm64-clang:
    if: ${{ !cancelled() && needs.integration-test-macos-26-arm64-clang.result == 'success' }}
    needs: integration-test-macos-26-arm64-clang
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-macos-26-arm64-clang
          path: build/
      - name: Fix permissions
        run: chmod +x build/src/deltahdl
      - name: E2E tests
        run: PYTHONPATH=.:scripts python3 -m run_sim_tests
