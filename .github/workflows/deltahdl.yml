  copy-paste-src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        id: pmd
        name: Resolve latest PMD release
        run: |
          ver=""
          for attempt in 1 2 3 4 5; do
            resp=$(curl -fSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/pmd/pmd/releases/latest) &&
              echo "${resp}" &&
              ver=$(echo "${resp}" | jq -r .tag_name |
                sed 's#pmd_releases/##')
            if echo "${ver}" | grep -qE '^[0-9]+\.[0-9]+'; then break; fi
            echo "::warning::PMD version discovery attempt ${attempt} failed;" \
              "retrying in $(( attempt * 5 ))s"
            sleep $(( attempt * 5 ))
          done
          if ! echo "${ver}" | grep -qE '^[0-9]+\.[0-9]+'; then
            echo "::error::could not resolve latest PMD release"
            exit 1
          fi
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
      - name: Restore PMD cache
        uses: actions/cache@v5
        with:
          key: pmd-${{ steps.pmd.outputs.ver }}
          path: pmd-bin-${{ steps.pmd.outputs.ver }}
      - name: Install PMD
        run: |
          PMD_VER="${{ steps.pmd.outputs.ver }}"
          if [ ! -d "pmd-bin-$PMD_VER" ]; then
            PMD="pmd-dist-$PMD_VER-bin.zip"
            URL=https://github.com/pmd/pmd/releases
            wget --progress=dot:giga "$URL/download/pmd_releases%2F$PMD_VER/$PMD"
            unzip "$PMD"
          fi
          echo "$PWD/pmd-bin-$PMD_VER/bin" >> "$GITHUB_PATH"
      - name: Detect copy-paste in source (C++)
        run: >-
          pmd cpd
          --minimum-tokens 100
          --language cpp
          --dir src/
  copy-paste-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        id: pmd
