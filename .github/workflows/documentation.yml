---
concurrency:
  cancel-in-progress: true
  group: documentation-${{ github.ref }}
jobs:
  jsonlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jsonlint
      # Reports whatever the steps ahead of it did, for the reason set out on
      # markdownlint below.
      - if: ${{ !cancelled() }}
        name: Lint JSON
        run: |
          find docs -name '*.json' -print0 \
            | xargs -0 -n1 jsonlint --quiet
  markdownlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/documentation.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install tools
        run: |
          npm install -g markdownlint-cli
          pip install \
            assert-no-inline-directives \
            assert-no-linter-config-files
      # ── Steps that report findings of their own ──
      # Every step from here on carries !cancelled(). Each scans the whole tree
      # rather than the change, so each can hold a backlog, and a step the job
      # stopped short of is reported the same way as one that found nothing: a
      # breach left standing in the first of them hid the rest for as long as
      # it stood. The job still fails when any of these fails; what changes is
      # that one run names every breach rather than the earliest.
      - if: ${{ !cancelled() }}
        name: Assert no inline markdownlint disables
        run: >-
          assert-no-inline-directives
          --tools markdownlint
          --verbose
          ${{ github.workspace }}
      - if: ${{ !cancelled() }}
        name: Assert no markdownlint config files
        run: >-
          assert-no-linter-config-files
          --linters markdownlint
          --verbose
          ${{ github.workspace }}
      # MD013 is off because a table row is one line and cannot be
      # wrapped: a row carrying a link outgrows eighty columns without
      # any way to shorten it but deleting a column.
      # --dot is what puts .claude/memories/ and .claude/skills/ in front
      # of the linter: markdownlint-cli skips a dot-prefixed directory
      # unless it is passed.
      # --disable is variadic, so the glob goes before it.
      - if: ${{ !cancelled() }}
        name: Lint Markdown
        run: markdownlint '**/*.md' --dot --disable MD013
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/documentation.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install tools
        run: >-
          pip install
          assert-no-inline-directives
          assert-no-linter-config-files
          yamllint
      # Reports whatever the steps ahead of it did, for the reason set out on
      # markdownlint above.
      - if: ${{ !cancelled() }}
        name: Assert no inline yamllint disables
        run: >-
          assert-no-inline-directives
          --tools yamllint
          --verbose
          .github/workflows/documentation.yml
      - if: ${{ !cancelled() }}
        name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/documentation.yml
name: documentation
on:
  push:
    branches: [main]
    paths:
      # A path filter matches a dot-prefixed directory only where the pattern
      # spells the dot out, so '**/*.md' passes over .claude/ and the entry
      # below is what starts this workflow on a change to the notes or the
      # skill. Eight pushes carrying nothing but .claude/skills/autopilot/
      # SKILL.md started no run at all before it was added.
      - '**/*.md'
      - .claude/**/*.md
      - docs/**/*.json
      - .github/workflows/documentation.yml
  workflow_dispatch: {}
