---
concurrency:
  cancel-in-progress: true
  group: documentation-${{ github.ref }}
jobs:
  concluding-yamllint-necessary:
    if: ${{ needs.determining-yamllint.outputs.yamllint-necessary == 'true' }}
    needs: determining-yamllint
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: 'true'
  concluding-yamllint-unnecessary:
    if: ${{ needs.determining-yamllint.outputs.yamllint-necessary == 'false' }}
    needs: determining-yamllint
    runs-on: ubuntu-24.04
    steps:
      - name: No-op
        run: 'true'
  determining-yamllint:
    outputs:
      yamllint-necessary: ${{ steps.decide.outputs.yamllint-necessary }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        name: Decide whether YAML linting is necessary
        run: |
          base='${{ github.event.before }}'
          head='${{ github.sha }}'
          zero='0000000000000000000000000000000000000000'
          if [ -z "$base" ] || [ "$base" = "$zero" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            necessary=true
          elif git diff --name-only "$base" "$head" \
              | grep -qE '^\.github/workflows/documentation\.yml$'; then
            necessary=true
          else
            necessary=false
          fi
          echo "yamllint-necessary=$necessary" >> "$GITHUB_OUTPUT"
  jsonlint:
    if: ${{ !failure() && !cancelled() }}
    needs:
      - concluding-yamllint-unnecessary
      - yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g jsonlint
      - name: Lint JSON
        run: |
          find docs -name '*.json' -print0 \
            | xargs -0 -n1 jsonlint --quiet
  markdownlint:
    if: ${{ !failure() && !cancelled() }}
    needs:
      - concluding-yamllint-unnecessary
      - yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/documentation.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install tools
        run: |
          npm install -g markdownlint-cli
          pip install \
            assert-no-inline-directives \
            assert-no-linter-config-files
      - name: Assert no inline markdownlint disables
        run: >-
          assert-no-inline-directives
          --tools markdownlint
          --verbose
          ${{ github.workspace }}/**/*
      - name: Assert no markdownlint config files
        run: >-
          assert-no-linter-config-files
          --linters markdownlint
          --verbose
          ${{ github.workspace }}
      - name: Lint Markdown
        run: markdownlint '**/*.md'
  yamllint:
    needs: concluding-yamllint-necessary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/documentation.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install tools
        run: >-
          pip install
          assert-no-inline-directives
          assert-no-linter-config-files
          yamllint
      - name: Assert no inline yamllint disables
        run: >-
          assert-no-inline-directives
          --tools yamllint
          --verbose
          .github/workflows/documentation.yml
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/documentation.yml
name: Documentation
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - docs/**/*.json
      - .github/workflows/documentation.yml
  workflow_dispatch: {}
