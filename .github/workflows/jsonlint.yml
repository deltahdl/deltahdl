---
concurrency:
  cancel-in-progress: true
  group: jsonlint-${{ github.ref }}
jobs:
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/jsonlint.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-comments
        run: pip install assert-no-comments
      - name: Assert no comments
        run: >-
          assert-no-comments
          --verbose
          ${{ github.workspace }}/.github/workflows/jsonlint.yml
  jsonlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: npm install -g @prantlf/jsonlint
      - name: Lint JSON
        run: >-
          git ls-files -z '*.json'
          | xargs -0 -r jsonlint
          --no-config
          --no-duplicate-keys
          --continue
          --check
          --indent 2
          --trailing-newline
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/jsonlint.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install tools
        run: >-
          pip install
          assert-no-inline-directives
          yamllint
      - if: ${{ !cancelled() }}
        name: Assert no inline yamllint disables
        run: >-
          assert-no-inline-directives
          --tools yamllint
          --verbose
          .github/workflows/jsonlint.yml
      - if: ${{ !cancelled() }}
        name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/jsonlint.yml
name: jsonlint
on:
  push:
    branches: [main]
    paths:
      - '**/*.json'
      - .github/workflows/jsonlint.yml
  workflow_dispatch: {}
