---
concurrency:
  cancel-in-progress: true
  group: scripts-${{ github.head_ref || github.ref_name }}
jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-scripts-static-analysis-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-scripts-static-analysis-
      - name: Install tools
        run: |
          pip install \
            assert-no-inline-directives \
            assert-no-linter-config-files \
            assert-one-assert-per-pytest \
            mypy pylint pypdf pytest pytest-cov pyyaml types-PyYAML yamllint
          npm install -g jscpd
      # ── Steps that report findings of their own ──
      # Every step from here on carries !cancelled(), so a step that finds
      # something no longer stops the steps behind it from looking. Each of
      # them scans the whole tree rather than the change, so a breach left
      # standing in one hid every breach behind it for as long as it stood: a
      # step that never ran is reported the same way as one that found nothing.
      # The job still fails when any of these fails, so nothing here is
      # un-gated; what changes is that one run names every breach.
      #
      # The steps above install what the scanning needs and have no findings of
      # their own.
      - if: ${{ !cancelled() }}
        name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/scripts.yml
      - if: ${{ !cancelled() }}
        name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - if: ${{ !cancelled() }}
        name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
      - if: ${{ !cancelled() }}
        name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test/lib/python/
          ${{ github.workspace }}/test/scripts/
      - if: ${{ !cancelled() }}
        name: Run pylint on source
        run: >-
          PYTHONPATH=.:scripts python3 -m pylint
          lib/python/ scripts/
          --fail-on=C,R,W --fail-under=10.0
      - if: ${{ !cancelled() }}
        name: Run pylint on tests
        run: >-
          PYTHONPATH=.:scripts
          python3 -m pylint --recursive=y
          lib/python/ test/scripts/ test/lib/python/
          --fail-on=C,R,W --fail-under=10.0
      - if: ${{ !cancelled() }}
        name: Run mypy on source
        run: >-
          PYTHONPATH=.:scripts python3 -m mypy --strict
          lib/python/ scripts/
      - if: ${{ !cancelled() }}
        name: Run mypy on tests
        run: >-
          MYPYPATH=.:scripts
          python3 -m mypy --strict --explicit-package-bases
          lib/python/ test/scripts/ test/lib/python/
      # A function under lib/python/ whose only caller is its own unit test
      # is dead, and --cov-fail-under=100 cannot say so: the test that keeps
      # the module at 100% is the call that makes the function look used.
      # That is how the fifteen deleted under #2996 survived, several of them
      # for months after the script that imported them was deleted. This step
      # asks the different question -- does anything name it -- and a name in
      # test/ counts, because lib/python/test_fixtures/ and the readings of
      # the standard in lib/python/reserved_words/ exist to be called from
      # there.
      - if: ${{ !cancelled() }}
        name: Assert every lib/python definition is named somewhere
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import re
          import sys
          lib = sorted(pathlib.Path("lib/python").rglob("*.py"))
          consumers = lib + sorted(pathlib.Path("scripts").rglob("*.py"))
          consumers += sorted(pathlib.Path("test").rglob("*.py"))
          source = {p: p.read_text().splitlines() for p in consumers}
          kinds = (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)
          dead = []
          for path in lib:
              for node in ast.parse("\n".join(source[path])).body:
                  if not isinstance(node, kinds) or node.name.startswith("_"):
                      continue
                  named = re.compile(r"\b" + re.escape(node.name) + r"\b")
                  found = any(
                      named.search(line)
                      for other, lines in source.items()
                      for number, line in enumerate(lines, 1)
                      if not (other == path and number == node.lineno)
                  )
                  if not found:
                      dead.append((path, node.lineno, node.name))
          for path, line, name in dead:
              print(
                  f"::error file={path},line={line}::{path}:{line} defines"
                  f" {name} and nothing names it; delete it or call it"
              )
          sys.exit(1 if dead else 0)
          PY
      - if: ${{ !cancelled() }}
        name: Detect copy-paste in source
        run: >-
          jscpd --pattern "**/*.py" --threshold 0
          --reporters console lib/python/ scripts/
      - if: ${{ !cancelled() }}
        name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "**/*.py" --threshold 0
          --reporters console lib/python/ test/scripts/ test/lib/python/
