      - name: Install tools
        run: pip install mypy pypdf pytest pyyaml types-PyYAML
      - name: Run mypy on tests
        run: >-
          MYPYPATH=.:scripts
          python3 -m mypy --strict --explicit-package-bases
          lib/python/ test/scripts/ test/lib/python/
  pylint-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install tools
        run: pip install pylint pypdf pytest pyyaml types-PyYAML
      - name: Run pylint on source
        run: >-
          PYTHONPATH=.:scripts python3 -m pylint
          lib/python/ scripts/
          --disable=missing-class-docstring
          --disable=missing-function-docstring
          --disable=missing-module-docstring
          --fail-on=C,R,W --fail-under=10.0
  pylint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
