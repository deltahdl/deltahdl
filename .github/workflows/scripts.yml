        run: >-
          PYTHONPATH=.:scripts python3 -m pytest
          test/scripts/satisfy_subclauses/unit/ -v
          --cov=satisfy_subclauses
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
      - name: Run integration tests
        run: >-
          PYTHONPATH=.:scripts python3 -m pytest
          test/scripts/satisfy_subclauses/integration/ -v
      - name: Run e2e tests
        run: >-
          PYTHONPATH=.:scripts python3 -m pytest
          test/scripts/satisfy_subclauses/e2e/ -v
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML
        run: |
          EMPTY='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY='key-ordering: enable'
          LL='line-length: disable'
          NL='new-line-at-end-of-file: enable'
          TR='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY, $KEY, $LL, $NL, $TR"
          yamllint --strict \
            --config-data \
            "{extends: default, rules: {$RULES}}" \
            .github/workflows/scripts.yml
name: scripts
on:
  push:
    branches: [main]
    paths:
      # Every job here lints or tests the Python under lib/python/ and
      # scripts/ with the tests beside it, so a change to any of those trees
      # is a change this workflow has to observe. Its own file is watched
      # because the yamllint job lints it, and the dependency graph because
      # test-lib-cli reads it as the record of which identifiers the
      # --subclause argument has to admit.
      - .github/workflows/scripts.yml
      - docs/dependency_graph.json
      - lib/python/**
      - scripts/**
      - test/lib/python/**
      - test/scripts/**
  workflow_dispatch:
