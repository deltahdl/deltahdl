      - name: Install tools
        run: pip install pylint pypdf pytest pyyaml types-PyYAML
      - name: Run pylint on tests
        run: >-
          PYTHONPATH=.:scripts
          python3 -m pylint --recursive=y
          lib/python/ test/scripts/ test/lib/python/
          --disable=missing-class-docstring
          --disable=missing-function-docstring
          --disable=missing-module-docstring
          --fail-on=C,R,W --fail-under=10.0
