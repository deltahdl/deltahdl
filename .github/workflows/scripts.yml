---
concurrency:
  cancel-in-progress: true
  group: scripts-${{ github.head_ref || github.ref_name }}
jobs:
  assert-every-dataclass-field-is-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-every-dataclass-field-is-read
        run: pip install assert-every-dataclass-field-is-read
      - name: Assert every dataclass field is read
        run: >-
          assert-every-dataclass-field-is-read
          --verbose
          ${{ github.workspace }}/lib/python/
          ${{ github.workspace }}/scripts/
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-comments
        run: pip install assert-no-comments
      - name: Assert no comments
        run: >-
          assert-no-comments
          --verbose
          ${{ github.workspace }}/.github/workflows/scripts.yml
          ${{ github.workspace }}/lib/python/
          ${{ github.workspace }}/scripts/
          ${{ github.workspace }}/test/lib/python/
          ${{ github.workspace }}/test/scripts/
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-inline-directives
        run: pip install assert-no-inline-directives
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-linter-config-files
        run: pip install assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
  assert-no-pytest-plugin-declarations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-pytest-plugin-declarations
        run: pip install assert-no-pytest-plugin-declarations
      - name: Assert no pytest plugin declarations
        run: >-
          assert-no-pytest-plugin-declarations
          --verbose
          ${{ github.workspace }}/lib/python/
          ${{ github.workspace }}/test/lib/python/
          ${{ github.workspace }}/test/scripts/
  assert-one-assert-per-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-one-assert-per-pytest
        run: pip install assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test/lib/python/
          ${{ github.workspace }}/test/scripts/
  assert-pytest-class-holds-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
