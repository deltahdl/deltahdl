            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-pytest-class-holds-state
        run: pip install assert-pytest-class-holds-state
      - name: Assert every pytest class holds state
        run: >-
          assert-pytest-class-holds-state
          --verbose
          ${{ github.workspace }}/test/lib/python/
          ${{ github.workspace }}/test/scripts/
  assert-pytest-fixture-name-is-needed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-pytest-fixture-name-is-needed
        run: pip install assert-pytest-fixture-name-is-needed
      - name: Assert every pytest fixture name is needed
        run: >-
          assert-pytest-fixture-name-is-needed
          --verbose
          ${{ github.workspace }}/lib/python/
          ${{ github.workspace }}/test/lib/python/
          ${{ github.workspace }}/test/scripts/
  assert-python-definition-is-used:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-python-definition-is-used
        run: pip install assert-python-definition-is-used
      - name: Assert every lib/python definition is used outside its own tests
        run: >-
          assert-python-definition-is-used
          --verbose
          --dont-search-in '${{ github.workspace }}/test/lib/python/{package}'
          --search-in ${{ github.workspace }}/lib/python/
          --search-in ${{ github.workspace }}/scripts/
          --search-in ${{ github.workspace }}/test/lib/python/
          --search-in ${{ github.workspace }}/test/scripts/
          ${{ github.workspace }}/lib/python/
      - name: Assert every scripts definition is used outside its own tests
        run: >-
          assert-python-definition-is-used
          --verbose
          --dont-search-in '${{ github.workspace }}/test/scripts/{package}'
          --search-in ${{ github.workspace }}/lib/python/
          --search-in ${{ github.workspace }}/scripts/
          --search-in ${{ github.workspace }}/test/lib/python/
          --search-in ${{ github.workspace }}/test/scripts/
          ${{ github.workspace }}/scripts/
  copy-paste-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Detect copy-paste in source
        run: >-
          jscpd --pattern "**/*.py" --threshold 0
          --reporters console lib/python/ scripts/
  copy-paste-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install jscpd
        run: npm install -g jscpd
      - name: Detect copy-paste in tests
        run: >-
          jscpd --pattern "**/*.py" --threshold 0
          --reporters console lib/python/ test/scripts/ test/lib/python/
  mypy-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install tools
        run: pip install mypy pypdf pytest pyyaml types-PyYAML
      - name: Run mypy on source
        run: >-
          PYTHONPATH=.:scripts python3 -m mypy --strict
          lib/python/ scripts/
  mypy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
