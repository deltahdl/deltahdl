---
concurrency:
  cancel-in-progress: true
  group: scripts-${{ github.head_ref || github.ref_name }}
jobs:
  assert-no-inline-directives:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-inline-directives
        run: pip install assert-no-inline-directives
      - name: Assert no inline directives
        run: >-
          assert-no-inline-directives
          --tools pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
  assert-no-linter-config-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-no-linter-config-files
        run: pip install assert-no-linter-config-files
      - name: Assert no linter config files
        run: >-
          assert-no-linter-config-files
          --linters pylint,mypy,yamllint
          --verbose
          ${{ github.workspace }}
  # A definition under lib/python/ whose only caller is its own unit test
  # is dead, and assert-no-unused-python-definition cannot say so: it
  # counts any name written under lib/python/, scripts/ or test/ as a
  # use, and the test that holds the module at --cov-fail-under=100
  # writes that name. This job counts the same uses except those in the
  # module's own test directory, so a fixture in lib/python/test_fixtures/
  # called from another module's tests still counts as a use. The fifteen
  # exports 7062648dc deleted under #2996 are what it would have reported.
  assert-no-test-only-python-definition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Assert every lib/python definition is used outside its tests
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import re
          import sys
          consumers = sorted(pathlib.Path("lib/python").rglob("*.py"))
          consumers += sorted(pathlib.Path("scripts").rglob("*.py"))
          consumers += sorted(pathlib.Path("test").rglob("*.py"))
          source = {p: p.read_text().splitlines() for p in consumers}
          kinds = (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)
          def used(name, path, lineno, tests):
              named = re.compile(r"\b" + re.escape(name) + r"\b")
              return any(
                  named.search(line)
                  for other, lines in source.items()
                  if tests not in other.parents
                  for number, line in enumerate(lines, 1)
                  if not (other == path and number == lineno)
              )
          dead = []
          # A file sitting directly in lib/python/ is skipped, because it
          # has no test directory of its own: discounting one would
          # discount the whole of test/lib/python/ and blind the scan.
          for module in sorted(pathlib.Path("lib/python").iterdir()):
              if not module.is_dir():
                  continue
              tests = pathlib.Path("test") / module
              for path in sorted(module.rglob("*.py")):
                  for node in ast.parse("\n".join(source[path])).body:
                      if not isinstance(node, kinds):
                          continue
                      if node.name.startswith("_"):
                          continue
                      if used(node.name, path, node.lineno, tests):
                          continue
                      dead.append((path, node.lineno, node.name))
          for path, line, name in dead:
              print(
                  f"::error file={path},line={line}::{path}:{line} defines"
                  f" {name}, and nothing outside {path.parent} and its own"
                  f" tests uses it; delete it or use it"
              )
          sys.exit(1 if dead else 0)
          PY
  # A function under lib/python/ whose only caller is its own unit test
  # is dead, and --cov-fail-under=100 cannot say so: the test that keeps
  # the module at 100% is the call that makes the function look used.
  # That is how the fifteen deleted under #2996 survived, several of them
  # for months after the script that imported them was deleted. This job
  # asks the different question -- does anything use it -- and a use in
  # test/ counts, because lib/python/test_fixtures/ exists to be called
  # from there.
  assert-no-unused-python-definition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Assert every lib/python definition is used somewhere
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import re
          import sys
          lib = sorted(pathlib.Path("lib/python").rglob("*.py"))
          consumers = lib + sorted(pathlib.Path("scripts").rglob("*.py"))
          consumers += sorted(pathlib.Path("test").rglob("*.py"))
          source = {p: p.read_text().splitlines() for p in consumers}
          kinds = (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)
          dead = []
          for path in lib:
              for node in ast.parse("\n".join(source[path])).body:
                  if not isinstance(node, kinds) or node.name.startswith("_"):
                      continue
                  named = re.compile(r"\b" + re.escape(node.name) + r"\b")
                  found = any(
                      named.search(line)
                      for other, lines in source.items()
                      for number, line in enumerate(lines, 1)
                      if not (other == path and number == node.lineno)
                  )
                  if not found:
                      dead.append((path, node.lineno, node.name))
          for path, line, name in dead:
              print(
                  f"::error file={path},line={line}::{path}:{line} defines"
                  f" {name} and nothing uses it; delete it or use it"
              )
          sys.exit(1 if dead else 0)
          PY
  assert-one-assert-per-pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Restore pip cache
        uses: actions/cache@v5
        with:
          key: >-
            pip-${{ github.job }}-${{
            hashFiles('.github/workflows/scripts.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            pip-${{ github.job }}-
      - name: Install assert-one-assert-per-pytest
        run: pip install assert-one-assert-per-pytest
      - name: Assert one assert per pytest
        run: >-
          assert-one-assert-per-pytest
          --verbose
          ${{ github.workspace }}/test/lib/python/
          ${{ github.workspace }}/test/scripts/
