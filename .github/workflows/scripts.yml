  # lib/python/test_fixtures/ and lib/python/test_utils/ were named by no
  # --cov flag until #2996, so nothing measured them and nothing was owed for
  # them. Six of the seven functions in test_utils/__init__.py had reached
  # zero callers by the time anybody counted. What these two jobs add is the
  # measurement the other ten packages already had; the claims themselves are
  # in the tests, and they are worth making because a stub that reports
  # success where it meant failure turns a test of an error path in another
  # suite into a test of nothing.
