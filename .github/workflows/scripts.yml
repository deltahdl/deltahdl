name: scripts
on:
  push:
    branches: [main]
    paths:
      # The readings in lib/python/ take the trees below as their subject --
      # reserved_words the C++ the tests are written in -- so a change to any
      # of them is a change this workflow has to observe. Its own file is
      # watched because its first job lints it, and the dependency graph
      # because test-lib-cli reads it as the record of which identifiers the
      # --subclause argument has to admit.
      - .github/workflows/scripts.yml
      - docs/dependency_graph.json
      - lib/cpp/**
      - lib/python/**
      - scripts/**
      - test/lib/python/**
      - test/scripts/**
      - test/src/**
  workflow_dispatch:
