---
description: >-
  Install clang-tidy-cache from the ctcache repository, retried so that a
  runner which cannot reach github.com for a moment does not take a whole
  clang-tidy matrix red. Nothing is pinned: the caller gets whatever the
  default branch holds, which is the floating toolchain every other install
  in this repository takes.
name: Install ctcache
runs:
  steps:
    - name: Install clang-tidy-cache from ctcache
      run: |
        export GIT_HTTP_LOW_SPEED_LIMIT=1000
        export GIT_HTTP_LOW_SPEED_TIME=30
        for n in 1 2 3 4 5; do
          if timeout -k 30 300 pip install \
            git+https://github.com/matus-chochlik/ctcache.git; then
            exit 0
          fi
          echo "::warning::ctcache install failed or stalled (attempt ${n});" \
            "retrying in $((n * 5))s"
          sleep $((n * 5))
        done
        echo "::error::ctcache install failed after 5 attempts"
        exit 1
      shell: bash
  using: composite
