---
description: >-
  Restore the googletest archive the cache-googletest job downloaded, and
  export DELTAHDL_GOOGLETEST_URL so that the CMake configure which follows
  reads that copy instead of asking github.com for it. Every job that
  configures the test tree needs the same archive, so without this a push
  asks github.com for one file once per job and a rate-limit fails a job
  before it runs a single check. Nothing is chosen here: the release this
  run builds against is whichever one the cache-googletest job resolved,
  and both inputs below are that job's outputs.
inputs:
  sha256:
    description: >-
      The SHA256 the cache-googletest job measured on the archive it
      downloaded, checked here so that a damaged cache entry fails the job
      that restored it rather than the compile that follows.
    required: true
  tag:
    description: >-
      The googletest release tag the cache-googletest job resolved, which
      names both the cache entry and the file inside it.
    required: true
name: Fetch googletest
runs:
  steps:
    - name: Restore the googletest archive
      uses: actions/cache/restore@v4
      with:
        fail-on-cache-miss: true
        key: googletest-${{ inputs.tag }}
        path: .deps
    - env:
        EXPECTED_SHA256: ${{ inputs.sha256 }}
        TAG: ${{ inputs.tag }}
      name: Check the restored archive and name it for CMake
      run: |
        set -euo pipefail
        archive="${GITHUB_WORKSPACE}/.deps/googletest-${TAG}.tar.gz"
        # sha256sum ships with coreutils and shasum with perl, and the runners
        # do not agree on which is present.
        if command -v sha256sum >/dev/null 2>&1; then
          echo "${EXPECTED_SHA256}  ${archive}" | sha256sum --check --status
        else
          echo "${EXPECTED_SHA256}  ${archive}" | shasum -a 256 --check --status
        fi
        echo "DELTAHDL_GOOGLETEST_URL=file://${archive}" >>"${GITHUB_ENV}"
      shell: bash
  using: composite
